<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#0a0a0a" rx="230"/>

  <!-- Dot matrix grid (clipped to rounded rect) -->
  <defs>
    <pattern id="grid" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.2" fill="rgba(255,255,255,0.055)"/>
    </pattern>
    <clipPath id="clip-bg">
      <rect width="1024" height="1024" rx="230"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#grid)" clip-path="url(#clip-bg)"/>

  <!-- Outer decorative ring -->
  <circle cx="512" cy="512" r="372" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <!-- Ring tracks -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="#141414" stroke-width="40"/>
  <circle cx="512" cy="512" r="285" fill="none" stroke="#141414" stroke-width="40"/>
  <circle cx="512" cy="512" r="230" fill="none" stroke="#141414" stroke-width="40"/>

  <!-- Activity ring — green (outermost, ~75%) -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="#21b573" stroke-width="37"
    stroke-dasharray="1601 535" stroke-linecap="round"
    transform="rotate(-90 512 512)"/>

  <!-- Hydration ring — blue (~70%) -->
  <circle cx="512" cy="512" r="285" fill="none" stroke="#4f7cf7" stroke-width="37"
    stroke-dasharray="1254 537" stroke-linecap="round"
    transform="rotate(-90 512 512)"/>

  <!-- Fasting ring — purple (~65%) -->
  <circle cx="512" cy="512" r="230" fill="none" stroke="#9b6dff" stroke-width="37"
    stroke-dasharray="939 506" stroke-linecap="round"
    transform="rotate(-90 512 512)"/>

  <!--
    FL in true dot-matrix (circles on a 24px grid, r=7)
    Grid: 12 cols × 7 rows = 264×144px
    Centered at (512,512): startX=380, startY=440
    Col spacing: 24px | Row spacing: 24px
    F = cols 0-4 | gap cols 5-6 | L = cols 7-11
  -->

  <!-- F — col 0 = x380, rows at y 440,464,488,512,536,560,584 -->
  <!-- row 0: top bar (5 dots) -->
  <circle cx="380" cy="440" r="7" fill="#f0f0f0"/>
  <circle cx="404" cy="440" r="7" fill="#f0f0f0"/>
  <circle cx="428" cy="440" r="7" fill="#f0f0f0"/>
  <circle cx="452" cy="440" r="7" fill="#f0f0f0"/>
  <circle cx="476" cy="440" r="7" fill="#f0f0f0"/>
  <!-- row 1: left stroke -->
  <circle cx="380" cy="464" r="7" fill="#f0f0f0"/>
  <!-- row 2: mid bar (4 dots) -->
  <circle cx="380" cy="488" r="7" fill="#f0f0f0"/>
  <circle cx="404" cy="488" r="7" fill="#f0f0f0"/>
  <circle cx="428" cy="488" r="7" fill="#f0f0f0"/>
  <circle cx="452" cy="488" r="7" fill="#f0f0f0"/>
  <!-- rows 3–6: left stroke -->
  <circle cx="380" cy="512" r="7" fill="#f0f0f0"/>
  <circle cx="380" cy="536" r="7" fill="#f0f0f0"/>
  <circle cx="380" cy="560" r="7" fill="#f0f0f0"/>
  <circle cx="380" cy="584" r="7" fill="#f0f0f0"/>

  <!-- L — col 7 = x548, rows at same y -->
  <!-- rows 0–5: left stroke -->
  <circle cx="548" cy="440" r="7" fill="#f0f0f0"/>
  <circle cx="548" cy="464" r="7" fill="#f0f0f0"/>
  <circle cx="548" cy="488" r="7" fill="#f0f0f0"/>
  <circle cx="548" cy="512" r="7" fill="#f0f0f0"/>
  <circle cx="548" cy="536" r="7" fill="#f0f0f0"/>
  <circle cx="548" cy="560" r="7" fill="#f0f0f0"/>
  <!-- row 6: bottom bar (5 dots) -->
  <circle cx="548" cy="584" r="7" fill="#f0f0f0"/>
  <circle cx="572" cy="584" r="7" fill="#f0f0f0"/>
  <circle cx="596" cy="584" r="7" fill="#f0f0f0"/>
  <circle cx="620" cy="584" r="7" fill="#f0f0f0"/>
  <circle cx="644" cy="584" r="7" fill="#f0f0f0"/>

  <!-- Blue accent dot below letters -->
  <circle cx="512" cy="660" r="6" fill="#4f7cf7" opacity="0.85"/>
</svg>
