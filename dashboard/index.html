<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Life OS</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="vendor/fonts.css">
<script src="vendor/chart.umd.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ═══════════════ DESIGN SYSTEM — Nothing OS ═══════════════ */
:root{
  --bg:#0a0a0a; --surface:#141414; --surface2:#1c1c1c; --surface3:#262626;
  --txt:#f2f2f2; --txt2:#9a9a9a; --txt3:#5c5c5c;
  --border:#232323; --border2:#333; --track:#222; --dot:#1f1f1f;
  --green:#21b573; --blue:#4f7cf7; --purple:#9b6dff; --orange:#ff8a3d;
  --yellow:#ffd166; --red:#ff5c5c; --pink:#ff6fae;
  --r:22px; --rsm:15px; --rxs:10px;
  --shadow:0 10px 32px rgba(0,0,0,.45);
  --glass:rgba(10,10,10,.68); --hl:rgba(255,255,255,.055);
  --elev:inset 0 1px 0 var(--hl),0 1px 2px rgba(0,0,0,.2),0 14px 34px -20px rgba(0,0,0,.55);
  --ease:cubic-bezier(.22,1,.36,1);          /* saída suave, tipo Linear */
  --spring:cubic-bezier(.34,1.35,.4,1);      /* mola física, tipo iOS/Arc */
}
[data-theme="light"]{
  --bg:#f4f4f2; --surface:#ffffff; --surface2:#f0f0ee; --surface3:#e6e6e3;
  --txt:#111; --txt2:#666; --txt3:#a3a3a3;
  --border:#e4e4e1; --border2:#d4d4d0; --track:#e8e8e5; --dot:#dcdcd8;
  --shadow:0 10px 32px rgba(0,0,0,.08);
  --glass:rgba(244,244,242,.68); --hl:rgba(255,255,255,.85);
  --elev:inset 0 1px 0 var(--hl),0 1px 2px rgba(0,0,0,.04),0 14px 34px -22px rgba(0,0,0,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--txt);
  background-image:radial-gradient(circle,var(--dot) 1.2px,transparent 1.2px);
  background-size:22px 22px; min-height:100vh; font-size:15px;
  transition:background-color .35s,color .35s;
  padding-bottom:calc(env(safe-area-inset-bottom) + 8px);
}
.doto{font-family:'Doto',monospace;font-weight:700;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rxs);padding:9px 12px;outline:none;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--txt2)}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ── topbar ── */
.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  background:var(--glass);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Doto';font-weight:900;font-size:19px;letter-spacing:2px}
.brand em{font-style:normal;color:var(--txt3)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(33,181,115,.5);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(33,181,115,.45)}70%{box-shadow:0 0 0 9px rgba(33,181,115,0)}100%{box-shadow:0 0 0 0 rgba(33,181,115,0)}}
.top-r{display:flex;align-items:center;gap:6px}
.wx{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt2);padding:5px 10px;border:1px solid var(--border);border-radius:99px;background:var(--surface)}
.wx b{font-family:'Doto';font-size:14px;color:var(--txt)}
.icobtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:15px;color:var(--txt2);position:relative;transition:transform .35s var(--spring),border-color .2s}
.icobtn:active{transform:scale(.85)}
.icobtn .badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:'Doto'}
.datebar{padding:14px 18px 2px;display:flex;align-items:baseline;justify-content:space-between}
.datebar h1{font-size:22px;font-weight:700;letter-spacing:-.4px}
.datebar .clock{font-family:'Doto';font-weight:900;font-size:22px;letter-spacing:1px}
.datebar small{display:block;color:var(--txt2);font-weight:400;font-size:13px;margin-top:2px;text-transform:capitalize}

/* ── nav ── */
nav{position:sticky;top:calc(env(safe-area-inset-top) + 58px);z-index:55;display:flex;gap:6px;overflow-x:auto;padding:10px 18px;scrollbar-width:none;
  background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:1px solid var(--border);
  background:var(--surface);color:var(--txt2);font-size:13px;font-weight:600;white-space:nowrap;transition:all .38s var(--spring)}
nav button.on{background:var(--txt);color:var(--bg);border-color:var(--txt);transform:scale(1.04);box-shadow:0 6px 20px -8px rgba(0,0,0,.5)}
nav button:active{transform:scale(.92)}

/* ── layout ── */
main{padding:6px 18px calc(env(safe-area-inset-bottom) + 96px);max-width:760px;margin:0 auto}

/* ── bottom nav ── */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:space-around;
  padding:8px 8px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--border);
  background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--txt3);
  font-size:10.5px;font-weight:600;padding:4px 0;transition:color .25s,transform .3s var(--spring)}
.bnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button.on{color:var(--txt)}
.bnav button.on::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--green)}
.bnav button:active{transform:scale(.9)}

/* ── foco do dia ── */
.foco{display:flex;gap:16px}
.foco .fhalf{flex:1;min-width:0}
.foco .fdiv{width:1px;flex:0 0 auto;background:repeating-linear-gradient(to bottom,var(--border2) 0 4px,transparent 4px 9px)}
.foco .ft{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fmeta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--txt2);flex-wrap:wrap}
.fmeta i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.fbar{width:3px;border-radius:3px;background:var(--green);flex:0 0 auto}

/* ── duo Atividade|Tarefas ── */
.home-duo{align-items:stretch}
.home-duo .card{margin-bottom:0;display:flex;flex-direction:column}
.rlegend-sm{gap:8px;margin-top:12px}
.rlegend-sm .rl .rlt b{font-size:11.5px}
.rlegend-sm .rl .rlt span{font-size:10px}
.rlegend-sm .rl .doto{font-size:14px}
.pri-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.done-badge{width:62px;height:62px;margin:8px auto 10px;border-radius:50%;border:1.6px solid var(--border2);display:grid;place-items:center;color:var(--green);font-size:24px}
.sec{display:none}
/* só transform+opacity nas animações de secção — blur animado mata o fps no WebView */
.sec.on{display:block;animation:fadeUp .32s var(--ease)}
.sec.on.sw-l{animation:slideL .3s var(--ease)}
.sec.on.sw-r{animation:slideR .3s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(42px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-42px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sec.on,.sec.on.sw-l,.sec.on.sw-r,.li{animation:none!important}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.55)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 96.5%,#fff),var(--surface) 48%);
  border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--elev)}
.card h3{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--txt3);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.card h3 .act{font-size:11px;color:var(--txt2);letter-spacing:.4px;text-transform:none;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.muted{color:var(--txt2)}.tiny{font-size:12px}.xs{font-size:11px}
.spacer{height:4px}

/* ── KPI tiles ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 96.5%,#fff),var(--surface) 52%);border:1px solid var(--border);border-radius:var(--rsm);padding:14px 15px;box-shadow:var(--elev)}
.kpi .lbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt3);display:flex;align-items:center;gap:6px}
.kpi .lbl i{width:7px;height:7px;border-radius:50%;flex:0 0 auto;font-style:normal}
.kpi .val{font-family:'Doto';font-weight:900;font-size:25px;margin-top:7px;letter-spacing:.5px}
.kpi .sub{font-size:11px;color:var(--txt2);margin-top:3px}
.up{color:var(--green)}.down{color:var(--red)}

/* ── progress bars ── */
.bar{height:7px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--txt);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.brow{margin-bottom:12px}
.brow:last-child{margin-bottom:0}
.brow .bt{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.brow .bt b{font-weight:600}
.brow .bt .doto{font-size:13px}

/* ── rings ── */
.rings-wrap{display:flex;align-items:center;gap:20px}
.rings{flex:0 0 auto}
.rings svg{display:block}
.rings circle{fill:none;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.rlegend{flex:1;display:flex;flex-direction:column;gap:11px}
.rlegend .rl{display:flex;align-items:center;gap:10px}
.rlegend .rl i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.rlegend .rl .rlt{flex:1}
.rlegend .rl .rlt b{display:block;font-size:12.5px;font-weight:600}
.rlegend .rl .rlt span{font-size:11px;color:var(--txt2)}
.rlegend .rl .doto{font-size:17px;font-weight:900}

/* ── list items ── */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);animation:slideIn .26s both}
.li:last-child{border-bottom:none}
.li .ic{width:38px;height:38px;border-radius:var(--rxs);background:var(--surface2);border:1px solid var(--border);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.li .bd{flex:1;min-width:0}
.li .bd b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .bd span{font-size:11.5px;color:var(--txt2)}
.li .tm{font-family:'Doto';font-weight:700;font-size:13px;color:var(--txt2);flex:0 0 auto}
.li.done .bd b{text-decoration:line-through;color:var(--txt3)}
.chk{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--border2);flex:0 0 auto;display:grid;place-items:center;font-size:11px;color:transparent;transition:all .3s var(--spring)}
.chk:active{transform:scale(.82)}
.chk.c{background:var(--green);border-color:var(--green);color:#fff;animation:pop .4s var(--spring);box-shadow:0 4px 14px -4px color-mix(in srgb,var(--green) 60%,transparent)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.3px}
.chip.red{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.chip.orange{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.chip.green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.chip.blue{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.chip.purple{background:color-mix(in srgb,var(--purple) 16%,transparent);color:var(--purple)}
.chip.gray{background:var(--surface3);color:var(--txt2)}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:var(--rsm);font-size:13.5px;font-weight:700;
  background:var(--txt);color:var(--bg);transition:transform .35s var(--spring),opacity .2s,box-shadow .3s;border:1px solid transparent;box-shadow:0 8px 22px -12px rgba(0,0,0,.55)}
.btn:active{transform:scale(.955)}
.btn.ghost{background:transparent;color:var(--txt);border-color:var(--border2)}
.btn.sm{padding:7px 13px;font-size:12px;border-radius:10px}
.btn.full{width:100%}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1}

/* ── agenda timeline ── */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:repeating-linear-gradient(to bottom,var(--border2) 0 4px,transparent 4px 9px)}
.tl .li{border:none;padding:9px 0}
.tl .li::before{content:'';position:absolute;left:-20.5px;margin-top:2px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2.5px solid var(--txt3)}
.tl .li.now::before{border-color:var(--green);background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 22%,transparent)}
.tl .li{position:relative}

/* ── habit grid ── */
.hgrid{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.hgrid .hlabel{grid-column:1/-1;font-size:11px;color:var(--txt2);font-weight:600;margin:8px 0 2px;display:flex;justify-content:space-between}
.hcell{aspect-ratio:1;border-radius:5px;background:var(--track);transition:transform .3s var(--spring),background .2s;cursor:pointer;border:1px solid transparent}
.hcell.on{background:var(--green);animation:pop .35s var(--spring)}
.hcell.today{border-color:var(--txt2)}
.hcell:active{transform:scale(.8)}
.streak{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--surface2);margin-bottom:14px}
.streak .fl{font-size:30px}
.streak .doto{font-size:30px;font-weight:900}

/* ── finance ── */
.fin-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.fin-nav b{font-size:16px;font-weight:700;text-transform:capitalize}
.fin-nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--txt2);font-size:15px}
.catbar{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.catbar .ci{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.catbar .cb{flex:1}
.catbar .cb .ct{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.catbar .cb .ct b{font-weight:600}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:0 0 auto;padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface2);color:var(--txt2);font-size:11.5px;font-weight:600}
.fchips button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.fchips button b{font-size:11px}
/* hero financeiro */
.fin-hero .hero-big{font-size:44px;font-weight:900;letter-spacing:.5px;line-height:1.05;margin-top:2px}
.spend{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px 13px;border-radius:var(--rsm);
  background:color-mix(in srgb,var(--green) 12%,transparent);flex-wrap:wrap}
.spend>span:first-child{font-size:12px;font-weight:600;color:var(--txt2)}
.spend b{font-size:19px;font-family:'Doto';font-weight:900;color:var(--green)}
.spend>span:last-child{margin-left:auto}
.hero-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.hero-mini>div{display:flex;flex-direction:column;gap:2px}
.hero-mini span{font-size:10px;letter-spacing:.4px}
.hero-mini b{font-size:16px}
.hero-recv{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:11px 13px;border-radius:var(--rsm);
  background:color-mix(in srgb,var(--blue) 12%,transparent);cursor:pointer}
.hero-recv>span{font-size:12px;font-weight:600;color:var(--txt2)}
.hero-recv b{font-size:17px}
/* objetivos */
.goal{padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer;animation:slideIn .26s both}
.goal:last-child{border-bottom:none}
.goal-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:13.5px}
.goal-t b{font-weight:600}.goal-t .doto{font-size:13px}
.tx{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);animation:slideIn .3s both}
.tx:last-child{border:none}
.tx .amt{font-family:'Doto';font-weight:900;font-size:15px;flex:0 0 auto}
.chartbox{position:relative;height:190px;margin-top:6px}

/* ── drawers / sheets ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:95;border:1px solid var(--border);border-bottom:none;
  background:color-mix(in srgb,var(--surface) 90%,transparent);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
  border-radius:28px 28px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .42s var(--ease);
  box-shadow:0 -24px 70px -24px rgba(0,0,0,.65),inset 0 1px 0 var(--hl);
  padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4.5px;border-radius:99px;background:var(--border2);margin:6px auto 16px}
.sheet h2{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.frow{margin-bottom:13px}
.frow label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);margin-bottom:6px}
.frow .hint{font-size:11px;color:var(--txt3);margin-top:5px;line-height:1.5}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.divider{height:1px;background:var(--border);margin:20px 0}
.side{position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);z-index:95;border-left:1px solid var(--border);
  background:color-mix(in srgb,var(--surface) 90%,transparent);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
  transform:translateX(105%);transition:transform .42s var(--ease);overflow-y:auto;
  box-shadow:-24px 0 70px -30px rgba(0,0,0,.6);
  padding:calc(env(safe-area-inset-top) + 18px) 18px 30px}
.side.on{transform:none}
.side h2{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.side .sub{font-size:12px;color:var(--txt2);margin-bottom:16px}
.alert{border:1px solid var(--border);border-radius:var(--rsm);padding:13px;margin-bottom:10px;background:var(--surface2);animation:slideIn .35s both}

/* ── emails ── */

.thinking i:nth-child(2){animation-delay:.18s}.thinking i:nth-child(3){animation-delay:.36s}

/* ── toast ── */

#toast.on{transform:translate(-50%,0);opacity:1}
.empty{text-align:center;color:var(--txt3);font-size:13px;padding:26px 0}
.kpis.three{grid-template-columns:repeat(3,1fr)}
.kpis.three .kpi{padding:12px 12px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}.kpis.three{grid-template-columns:repeat(3,1fr)}}
</style>

<script>
/* ═══════════════ LIFE OS — núcleo ═══════════════ */
'use strict';
const TZ='Atlantic/Azores';
const K={tasks:'fl_tasks_v3',fin:'fl_fin_v1',set:'fl_settings_v1',habits:'fl_habits_v1',workouts:'fl_workouts_v2',
  meals:'fl_meals_v2',weight:'fl_weight_v1',water:'fl_water_v1',sleep:'fl_sleep_v1',run:'fl_run_done_v1',
  social:'fl_social_v1',lab:'fl_lab_v1',labnotes:'fl_labnotes_v1',proj:'fl_proj_v1',read:'fl_read_v1',
  eod:'fl_eod_v1',mcl:'fl_mcl_v1',theme:'fl_theme',key:'fl_anthropic_key',
  routine:'fl_routine_v1',calCache:'fl_cal_cache_v1',mailCache:'fl_mail_cache_v1',goals:'fl_goals_v1',
  finRec:'fl_fin_rec_v1'};

const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

const DEFAULT_SETTINGS={
  name:'Filipe', startWeight:95, goalWeight:73, height:1.69,
  waterGoal:2.5, fastGoal:14, kcalGoal:1900, protGoal:150,
  budgets:{hab:650,ali:400,tra:180,sau:120,sub:60,pes:150,mat:250,out:100}
};
const getSettings=()=>({...DEFAULT_SETTINGS,...LS(K.set,{}),budgets:{...DEFAULT_SETTINGS.budgets,...(LS(K.set,{}).budgets||{})}});
const S=getSettings;

/* datas pt-PT no fuso dos Açores */
const now=()=>new Date();
const azParts=d=>{const p={};new Intl.DateTimeFormat('pt-PT',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).forEach(x=>p[x.type]=x.value);return p};
const todayISO=()=>{const p=azParts(now());return `${p.year}-${p.month}-${p.day}`};
const isoAddDays=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const weekStartISO=()=>{const d=new Date(todayISO()+'T12:00:00Z');const dow=(d.getUTCDay()+6)%7;return isoAddDays(todayISO(),-dow)}; /* 2ª feira */
const fmtDay=iso=>new Intl.DateTimeFormat('pt-PT',{timeZone:'UTC',weekday:'short',day:'numeric'}).format(new Date(iso+'T12:00:00Z'));
const fmtLong=iso=>new Intl.DateTimeFormat('pt-PT',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'}).format(new Date(iso+'T12:00:00Z'));
const nowHM=()=>{const p=azParts(now());return `${p.hour}:${p.minute}`};
const monthKey=d=>d.toISOString().slice(0,7);
const eur=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR',maximumFractionDigits:n%1?2:0}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deent=s=>{const t=document.createElement('textarea');t.innerHTML=String(s||'');return t.value};

/* ── countUp: números que contam do 0 ── */
function countUp(el,target,{dec=0,suffix='',prefix='',dur=1100}={}){
  if(!el)return;
  const t0=performance.now();
  const step=t=>{
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); /* easeOutCubic */
    const v=target*e;
    el.textContent=prefix+v.toLocaleString('pt-PT',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suffix;
    if(p<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const staticNum=(v,dec=0,suffix='',prefix='')=>prefix+v.toLocaleString('pt-PT',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suffix;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}
function haptic(style='light'){
  try{
    const C=window.Capacitor;
    if(C&&C.Plugins&&C.Plugins.Haptics){C.Plugins.Haptics.impact({style:style==='light'?'LIGHT':'MEDIUM'});return}
    if(navigator.vibrate)navigator.vibrate(8);
  }catch(e){}
}

/* ═══════════════ ESTADO GLOBAL ═══════════════ */
let _finMonth=monthKey(now());
let _finFilter='all';
let _charts={};
window._ringsAnimated=false;
window._homeAnimated=false;
window._finAnimated=false;

const FIN_CATS={
  sal:{n:'Salário',ic:'💰',c:'var(--green)'},
  lab:{n:'Lab · trabalho',ic:'⬡',c:'var(--blue)'},
  mat:{n:'Materiais',ic:'🔧',c:'var(--purple)'},
  hab:{n:'Habitação',ic:'🏠',c:'var(--orange)'},
  ali:{n:'Alimentação',ic:'🍽',c:'var(--yellow)'},
  tra:{n:'Transporte',ic:'🚗',c:'var(--pink)'},
  sau:{n:'Saúde',ic:'💪',c:'var(--green)'},
  sub:{n:'Subscrições',ic:'📱',c:'var(--red)'},
  pes:{n:'Pessoal',ic:'🎯',c:'var(--blue)'},
  out:{n:'Outros',ic:'•',c:'var(--txt3)'}
};
const PRI={alta:{n:'Alta',c:'red',w:0},media:{n:'Média',c:'orange',w:1},baixa:{n:'Baixa',c:'gray',w:2}};
const priOf=t=>PRI[t.pri]||PRI.media;
const FASES=['Modelo','Enceramento','Prova de estrutura','Acabamento','Maquilhagem','Entregue'];
/* Rotina diária — gerida pelo utilizador (adicionar/remover na Agenda) */
const getRoutine=()=>LS(K.routine,[]).slice().sort((a,b)=>a.h<b.h?-1:1);
function routineIcon(t){
  const s=t.toLowerCase();
  if(/corrida|correr|run/.test(s))return '🏃';
  if(/treino|freeletics|gym|giná|muscula/.test(s))return '💪';
  if(/ler|leitura|livro/.test(s))return '📖';
  if(/estud|ia |curso|aprend/.test(s))return '🧠';
  if(/medita|respira|yoga/.test(s))return '🧘';
  if(/almoço|jantar|refei|comer/.test(s))return '🍽';
  if(/lab|prótese|trabalho/.test(s))return '🦷';
  if(/fecho|planear|rever/.test(s))return '🔒';
  if(/dormir|deitar|sono/.test(s))return '😴';
  return '📍';
}
function addRoutine(){
  const t=document.getElementById('rtT').value.trim();
  const h=document.getElementById('rtH').value;
  if(!t)return toast('Dá um nome à atividade');
  if(!h)return toast('Escolhe a hora');
  const R=LS(K.routine,[]);R.push({id:Date.now(),h,t,ic:routineIcon(t)});save(K.routine,R);
  renderAgenda();toast('Atividade adicionada ✓');
}
function delRoutine(id){
  save(K.routine,LS(K.routine,[]).filter(x=>x.id!==id));renderAgenda();toast('Atividade removida');
}
/* ── Gmail ao vivo — OAuth no dispositivo, nada guardado no servidor ──
   Sem dados inventados: os emails vêm mesmo do teu Gmail (só de leitura). */
const GMAIL_SCOPE='https://www.googleapis.com/auth/gmail.readonly';
const CAL_SCOPE='https://www.googleapis.com/auth/calendar.readonly';
let _gmailTok=null;               // access token (em memória / sessionStorage)
let _calTok=null;                 // token do calendário
/* caches persistentes: a última sincronização fica guardada no dispositivo,
   por isso a Agenda/Emails mostram dados reais mesmo antes de renovar o token */
let _emailCache=(LS(K.mailCache,null)||{}).list||null;
let _emailSyncTs=(LS(K.mailCache,null)||{}).ts||0;
let _calCache=(LS(K.calCache,null)||{}).evs||null;
let _calSyncTs=(LS(K.calCache,null)||{}).ts||0;
const agoLabel=ts=>{if(!ts)return'';const m=Math.round((Date.now()-ts)/60000);
  return m<1?'agora mesmo':m<60?`há ${m} min`:m<1440?`há ${Math.round(m/60)} h`:`há ${Math.round(m/1440)} d`};
/* Client ID Web embutido (público, preso ao domínio/app) — funciona sem colar nada.
   Ainda dá para pôr outro em localStorage (fl_gmail_client) se um dia precisares. */
const GOOGLE_WEB_CLIENT_ID='605608011780-te33hr14en2mcfp974p67dg958tr8e2c.apps.googleusercontent.com';
const gmailClientId=()=>localStorage.getItem('fl_gmail_client')||GOOGLE_WEB_CLIENT_ID;
const isNative=()=>{try{return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())}catch(e){return false}};
/* Login Google NATIVO (dentro do APK) via plugin. Uma sessão concede os dois
   scopes (Gmail + Calendário), por isso o mesmo token serve para ambos. */
async function nativeGoogleToken(){
  const GA=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.GoogleAuth;
  if(!GA)throw new Error('login nativo indisponível');
  try{await GA.initialize({clientId:GOOGLE_WEB_CLIENT_ID,scopes:[GMAIL_SCOPE,CAL_SCOPE],grantOfflineAccess:true})}catch(e){}
  const u=await GA.signIn();
  const tok=u&&u.authentication&&u.authentication.accessToken;
  if(!tok)throw new Error('sem token de acesso');
  return tok;
}
function setGoogleToken(tok){
  _gmailTok=tok;_calTok=tok;
  try{sessionStorage.setItem('fl_gmail_tok',tok);sessionStorage.setItem('fl_cal_tok',tok)}catch(e){}
}
/* Mostra o erro real do login (código incluído) num ecrã, para diagnóstico. */
function googleErr(e){
  const lines=[];
  try{
    if(e==null)lines.push('(erro vazio)');
    else{
      if(e.message)lines.push('message: '+e.message);
      if(e.code!==undefined)lines.push('code: '+e.code);
      if(e.errorMessage)lines.push('errorMessage: '+e.errorMessage);
      const raw=JSON.stringify(e,Object.getOwnPropertyNames(e));
      if(raw&&raw!=='{}')lines.push('raw: '+raw);
      if(!lines.length)lines.push(String(e));
    }
  }catch(_){lines.push(String(e))}
  const codeHint=(String(e&&(e.code||e.message))||'').match(/\b(10|12500|12501|12502|7|8)\b/);
  let dica='';
  if(codeHint){const c=codeHint[1];
    if(c==='10')dica='Código 10 = DEVELOPER_ERROR: a credencial Android não existe ou o pacote/SHA-1 não batem certo (ou ainda não propagou).';
    else if(c==='12501')dica='Código 12501: login cancelado pelo utilizador.';
    else if(c==='12500')dica='Código 12500: falha de configuração do Sign-In (consent screen / test user).';
    else if(c==='7')dica='Código 7: sem rede.';
  }
  sheetOpen(`<h2>⚠ Erro no login Google</h2>
    <div class="ai-out" style="font-size:12px;white-space:pre-wrap;word-break:break-word">${esc(lines.join('\n'))}</div>
    ${dica?`<div class="hint" style="margin-top:10px">${esc(dica)}</div>`:''}
    <div class="hint" style="margin-top:8px">Faz uma captura deste ecrã e envia — dá-me o código exato para resolver.</div>`);
}

/* categorização por urgência (heurística pt/en) — vermelho→cinzento */
function classifyEmail(from,subject,snippet,unread){
  const s=((subject||'')+' '+(snippet||'')+' '+(from||'')).toLowerCase();
  const has=(...w)=>w.some(x=>s.includes(x));
  const promo=has('newsletter','unsubscribe','cancelar subscri','promo','desconto','discount','% off','sale','coupon','cupão','waitlist','webinar');
  const pessoal=has('inscri','corrida','clube','maratona','convite','aniversár','birthday');
  if(has('urgente','urgent','vence','expira','expire','ação necessária','action required','último dia','last day','prazo','overdue','em atraso','suspens','2 days','2 dias','24 hour','24 hora'))
    return {chip:'red',ch:'Urgente',ic:'🔴'};
  if(has('fatura','invoice','recibo','pagamento','payment','seguro','renova','subscri','preço','price','segurança social','finanças','autoridade tribut','banco','extrato','débito'))
    return {chip:'orange',ch:'Requer ação',ic:'🟠'};
  if(pessoal) return {chip:'green',ch:'Pessoal',ic:'🟢'};
  if(promo) return {chip:'gray',ch:'Informativo',ic:'⚪'};
  if(unread) return {chip:'blue',ch:'Ler depois',ic:'🔵'};
  return {chip:'gray',ch:'Informativo',ic:'⚪'};
}
const senderName=f=>{const m=/^\s*"?([^"<]+?)"?\s*</.exec(f||'');return (m?m[1]:(f||'').split('<')[0]||f||'').trim()||f};

/* ═══════════════ NAVEGAÇÃO ═══════════════ */
const SECS=['home','agenda','emails','lab','fin','habits','proj'];
const pill=id=>document.querySelector(`nav [data-sec="${id}"]`);
let _bTasks=false; /* tab "Tarefas" da barra inferior aponta para as tarefas dentro da Agenda */
function go(id,btn,dir){
  haptic();
  if(id!=='agenda')_bTasks=false;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  if(btn)btn.classList.add('on');
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on','sw-l','sw-r'));
  const sec=document.getElementById('sec-'+id);
  sec.classList.add('on');
  if(dir)sec.classList.add(dir==='left'?'sw-l':'sw-r');
  ({home:renderHome,agenda:renderAgenda,emails:renderEmails,
    habits:renderHabits,proj:renderProj,lab:renderLab,fin:renderFin})[id]();
  if(btn&&btn.scrollIntoView)try{btn.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}catch(e){}
  syncBnav(id);
  window.scrollTo(0,0); /* instantâneo — scroll suave competia com a animação da secção */
  setTimeout(renderSide,180); /* badge de alertas fora do caminho crítico da navegação */
}
function syncBnav(id){
  const key=id==='home'?'home':id==='habits'?'habits':id==='agenda'?(_bTasks?'tasks':'agenda'):'more';
  document.querySelectorAll('#bnav button').forEach(b=>b.classList.toggle('on',b.dataset.b===key));
}
function goTasks(){
  _bTasks=true;
  go('agenda',pill('agenda'));
  setTimeout(()=>{const c=document.getElementById('tasksCard');if(c)try{c.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}},120);
}
function openMore(){
  haptic();
  const row=(id,ic,t,s)=>`<div class="li" style="cursor:pointer" onclick="closeAll();go('${id}',pill('${id}'))">
    <div class="ic">${ic}</div><div class="bd"><b>${t}</b><span>${s}</span></div><span class="tm">›</span></div>`;
  sheetOpen(`<h2>Mais</h2>
    ${row('emails','📧','Emails','inbox categorizado por urgência')}
    ${row('lab','🔬','Laboratório','trabalhos, notas e entregas')}
    ${row('fin','💰','Finanças','estado, objetivos e movimentos')}
    ${row('proj','🚀','Projetos','os teus projetos e passos')}
    <div class="divider"></div>
    <div class="li" style="cursor:pointer" onclick="closeAll();sideOpen()"><div class="ic">🔔</div><div class="bd"><b>A precisar de ti</b><span>alertas do dia</span></div><span class="tm">›</span></div>
    <div class="li" style="cursor:pointer" onclick="closeAll();openSettings()"><div class="ic">⚙️</div><div class="bd"><b>Definições</b><span>perfil, orçamentos, backup</span></div><span class="tm">›</span></div>`);
}
/* ── swipe horizontal para mudar de secção ── */
let _swX=0,_swY=0,_swOK=false;
document.addEventListener('touchstart',e=>{
  _swOK=false;
  if(document.querySelector('.sheet.on,.side.on'))return;
  const t=e.touches[0];if(!t)return;
  if(e.target.closest('nav,.fchips,.chartbox,canvas,input,select,textarea,.sheet,.side'))return;
  _swX=t.clientX;_swY=t.clientY;_swOK=true;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!_swOK)return;_swOK=false;
  const t=e.changedTouches[0];if(!t)return;
  const dx=t.clientX-_swX,dy=t.clientY-_swY;
  if(Math.abs(dx)<64||Math.abs(dx)<Math.abs(dy)*1.6)return;
  const on=document.querySelector('nav button.on');if(!on)return;
  const i=SECS.indexOf(on.dataset.sec)+(dx<0?1:-1);

function ringProg(){
  const st=S();
  const tasks=LS(K.tasks,[]); const ws=weekStartISO();
  /* semana: abertas + concluídas esta semana (planeamento semanal) */
  const tDone=tasks.filter(t=>t.done&&t.doneAt&&t.doneAt>=ws).length;
  const tTot=tasks.filter(t=>!t.done).length+tDone;
  const pTasks=tTot?tDone/tTot:0;
  const H=LS(K.habits,{}); const hk=Object.keys(H); const hDone=hk.filter(n=>H[n][todayISO()]).length;
  const pHab=hk.length?hDone/hk.length:0;
  const water=LS(K.water,{})[todayISO()]||0; const pWater=Math.min(1,water/st.waterGoal);
  return {pTasks,tDone,tTot,pHab,hDone,hTot:hk.length,water,pWater,st};
}
function ringsSVG(r,size=150){
  const cx=size/2,sw=size*0.0733;
  const ring=(rad,color,p,delay)=>{
    const c=2*Math.PI*rad;
    return `<circle cx="${cx}" cy="${cx}" r="${rad}" stroke="var(--track)" stroke-width="${sw}"></circle>
      <circle class="rp" data-p="${p}" data-c="${c}" cx="${cx}" cy="${cx}" r="${rad}" stroke="${color}" stroke-width="${sw}"
        stroke-dasharray="${c}" stroke-dashoffset="${c}" style="transition-delay:${delay}ms"></circle>`;
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${ring(size*0.4267,'var(--green)',r.pTasks,0)}${ring(size*0.3333,'var(--purple)',r.pHab,120)}${ring(size*0.24,'var(--blue)',r.pWater,240)}
  </svg>`;
}

function untilLbl(h){

}
function focusOfDay(today,open){

function sparkline(vals,color){

    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 5px ${color})"/></svg>`;

function calConnect(){
  if(isNative()){
    (async()=>{try{setGoogleToken(await nativeGoogleToken());calRefresh()}
    catch(e){googleErr(e)}})();
    return;
  }
  if(!(window.google&&google.accounts&&google.accounts.oauth2))
    return toast('Google indisponível — precisas de ligação');
  try{
    const tc=google.accounts.oauth2.initTokenClient({
      client_id:gmailClientId(),scope:CAL_SCOPE,
      callback:(r)=>{if(r&&r.access_token){_calTok=r.access_token;try{sessionStorage.setItem('fl_cal_tok',r.access_token)}catch(e){}calRefresh()}else toast('Autorização cancelada')}
    });
    tc.requestAccessToken();
  }catch(e){toast('Falha ao iniciar login Google')}
}
/* re-renderiza a secção ativa sem saltar de ecrã (para syncs em segundo plano) */
function softRender(){
  const on=document.querySelector('nav button.on');if(!on)return;
  const f={home:renderHome,agenda:renderAgenda,emails:renderEmails}[on.dataset.sec];
  if(f)f();
  renderSide();
}
async function calRefresh(silent){
  const tok=_calTok||sessionStorage.getItem('fl_cal_tok');
  if(!tok)return silent?null:calConnect();
  /* desde as 00:00 de hoje, para a Agenda de Hoje incluir o dia inteiro */
  const timeMin=new Date(Date.now()-1000*60*60*24).toISOString();
  const timeMax=new Date(Date.now()+1000*60*60*24*30).toISOString();
  const url='https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=40'
    +'&timeMin='+encodeURIComponent(timeMin)+'&timeMax='+encodeURIComponent(timeMax);
  try{
    const r=await fetch(url,{headers:{Authorization:'Bearer '+tok}});
    if(r.status===401){_calTok=null;sessionStorage.removeItem('fl_cal_tok');
      if(!silent){toast('Sessão expirou — liga outra vez');renderAgenda()}return}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const T=todayISO();
    _calCache=(j.items||[]).filter(ev=>ev.status!=='cancelled').map(ev=>({
      title:ev.summary||'(sem título)',loc:ev.location||'',
      start:ev.start.dateTime||ev.start.date,allDay:!ev.start.dateTime}))
      .filter(ev=>evISO(ev)>=T);
    _calSyncTs=Date.now();
    save(K.calCache,{ts:_calSyncTs,evs:_calCache});
    softRender();if(!silent)toast(`${_calCache.length} marcações ✓`);
  }catch(e){if(!silent){toast('Erro no calendário: '+e.message)}}
}

/* ═══════════════ HÁBITOS ═══════════════ */
/* cur: sequência a decorrer (se hoje ainda não está marcado, conta a partir de ontem
   sem quebrar). best: a maior sequência de sempre nos últimos 120 dias. */
function habitStreaks(){
  const H=LS(K.habits,{});const T=todayISO();let cur=0,best=0;
  Object.values(H).forEach(days=>{
    const start=days[T]?0:1;
    let s=0;for(let d=start;d<366;d++){if(days[isoAddDays(T,-d)])s++;else break}
    cur=Math.max(cur,s);
    let run=0;
    for(let d=120;d>=0;d--){
      if(days[isoAddDays(T,-d)]){run++;if(run>best)best=run}else run=0;
    }
  });
  return {cur,best};
}
function renderHabits(){
  const el=document.getElementById('sec-habits');
  const H=LS(K.habits,{});const days=[...Array(14)].map((_,i)=>isoAddDays(todayISO(),-(13-i)));
  const totals=days.map(d=>Object.values(H).filter(h=>h[d]).length);
  const hs=habitStreaks();
  el.innerHTML=`
  <div class="streak"><span class="fl">🔥</span><div><div class="doto" data-num="${hs.cur}"></div><div class="tiny muted">dias consecutivos agora · melhor sequência: <b class="doto" style="font-size:13px">${hs.best}</b> dias</div></div></div>
  <div class="card"><h3>Grelha 14 dias <span class="act">${fmtDay(days[0])} → hoje</span></h3>
    <div class="hgrid">
    ${Object.entries(H).map(([name,d])=>{const en=encodeURIComponent(name);return `
      <div class="hlabel"><span>${esc(name)}</span><span style="display:flex;gap:9px;align-items:center"><span class="doto">${days.filter(x=>d[x]).length}/14</span><button onclick="delHabit('${en}')" style="color:var(--txt3);font-size:12px" aria-label="Apagar hábito">✕</button></span></div>
      ${days.map(x=>`<div class="hcell ${d[x]?'on':''} ${x===todayISO()?'today':''}" onclick="toggleHabit('${en}','${x}')"></div>`).join('')}`}).join('')||'<div class="empty" style="grid-column:1/-1;padding:16px 0">Sem hábitos — adiciona o primeiro 👇</div>'}
    </div>
    <div class="addrow" style="margin-top:14px"><input id="habIn" placeholder="Novo hábito (ex.: Meditar, Ler 20 min)…" onkeydown="if(event.key==='Enter')addHabit()"><button class="btn" onclick="addHabit()">＋</button></div>
  </div>
  <div class="card"><h3>Consistência diária</h3><div class="chartbox" style="height:150px"><canvas id="hChart"></canvas></div></div>
  <div class="card"><h3>Insights</h3>
    ${habitInsights().map((s,i)=>`<div class="li" style="animation-delay:${i*70}ms"><div class="ic">${s.ic}</div><div class="bd"><b>${s.t}</b><span>${s.s}</span></div></div>`).join('')}
  </div>`;
  nums(el,true);
  drawHabitChart(days,totals,Math.max(1,Object.keys(H).length));
}

  const i=document.getElementById('habIn');const v=i.value.trim();if(!v)return;
  const H=LS(K.habits,{});if(H[v])return toast('Esse hábito já existe');
  H[v]={};save(K.habits,H);renderHabits();toast('Hábito adicionado ✓');

function delHabit(nameEnc){
  const name=decodeURIComponent(nameEnc);
  if(!confirm('Apagar o hábito "'+name+'" e o seu histórico?'))return;

function habitInsights(){
  const H=LS(K.habits,{});const out=[];
  const rates=Object.entries(H).map(([n,d])=>{
    const days=[...Array(14)].map((_,i)=>isoAddDays(todayISO(),-i));
    return [n,days.filter(x=>d[x]).length/14];
  }).sort((a,b)=>b[1]-a[1]);
  if(rates[0])out.push({ic:'🏆',t:`${rates[0][0]} é o teu hábito mais forte`,s:`${Math.round(rates[0][1]*100)}% de consistência nas últimas 2 semanas`});
  const weak=rates[rates.length-1];
  if(weak&&weak[1]<0.6)out.push({ic:'🎯',t:`Foco em: ${weak[0]}`,s:`Apenas ${Math.round(weak[1]*100)}% — tenta ancorá-lo a um hábito forte`});
  const hs=habitStreaks();
  out.push({ic:'🔥',t:`Streak atual: ${hs.cur} dias`,s:hs.cur>=hs.best&&hs.cur>0?'É a tua melhor sequência de sempre — não quebres a corrente':`Melhor sequência: ${hs.best} dias — dá para bater`});
  return out;
}

  const tx=LS(K.fin,[]).filter(t=>t.m===mk);
  const inc=tx.filter(t=>t.v>0).reduce((a,t)=>a+t.v,0);
  const exp=-tx.filter(t=>t.v<0).reduce((a,t)=>a+t.v,0);
  const byCat={};tx.filter(t=>t.v<0).forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)-t.v);
  return {tx,inc,exp,saldo:inc-exp,poup:inc?Math.round((inc-exp)/inc*100):0,byCat};

function delTx(idx){

function saveTx(){
  const raw=parseFloat(document.getElementById('txV').value);
  if(!raw||raw<=0)return toast('Indica o valor');
  /* descrição opcional — se vazia, usa o nome da categoria (menos atrito) */
  const n=document.getElementById('txN').value.trim()||FIN_CATS[_txCat].n;
  const v=_txType==='exp'?-Math.abs(raw):Math.abs(raw);
  const all=LS(K.fin,[]);
  if(_txEditIdx!=null&&all[_txEditIdx]){
    const t=all[_txEditIdx];t.n=n;t.cat=_txCat;t.v=v;
    save(K.fin,all);_txEditIdx=null;
    closeAll();window._finAnimated=false;renderFin();
    return toast('Movimento atualizado ✓');
  }
  const day=_finMonth===monthKey(now())?+todayISO().slice(8):1;
  const tx={m:_finMonth,d:day,n,cat:_txCat,v};
  if(_txRec){
    const id=Date.now();
    const R=LS(K.finRec,[]);R.push({id,n,cat:_txCat,v,d:day});save(K.finRec,R);
    tx.recId=id;
  }
  all.push(tx);save(K.fin,all);
  closeAll();window._finAnimated=false;renderFin();
  toast(_txRec?`${eur(Math.abs(v))} guardado — repete todos os meses 🔁`:`${_txType==='exp'?'Despesa':'Receita'} de ${eur(Math.abs(v))} guardada ✓`);

function drawFinChart(all){
  if(!window.Chart)return;const ctx=document.getElementById('finChart');if(!ctx)return;
  if(_charts.f)_charts.f.destroy();const t=chartTheme();
  const months=[...Array(6)].map((_,i)=>{const[y,m]=_finMonth.split('-').map(Number);return monthKey(new Date(y,m-1-(5-i),15))});
  /* saldo acumulado: soma de tudo até ao fim de cada mês (a "linha da poupança") */
  const data=months.map(mk=>all.filter(x=>x.m<=mk).reduce((a,x)=>a+x.v,0));

  grad.addColorStop(0,'rgba(33,181,115,.28)');grad.addColorStop(1,'rgba(33,181,115,0)');
  _charts.f=new Chart(ctx,{type:'line',
    data:{labels:months.map(mk=>monthLabel(mk).slice(0,3)),datasets:[
      {data,borderColor:t.green,backgroundColor:grad,fill:true,tension:.38,borderWidth:2.5,
       pointRadius:3,pointBackgroundColor:t.green,pointBorderColor:t.surface,pointBorderWidth:2,
       pointHoverRadius:5}
    ]},
    options:{...baseOpts(t),plugins:{...baseOpts(t).plugins,tooltip:{...baseOpts(t).plugins.tooltip,
      callbacks:{label:c=>' '+eur(c.parsed.y)+' acumulado'}}}}});
}

/* Alertas gerados dos dados REAIS (nada inventado): entregas do lab,
   tarefas de prioridade alta, emails urgentes, marcações de hoje, orçamentos. */
function buildAlerts(){
  const out=[];const T=todayISO();const hm=nowHM();
  const lab=LS(K.lab,[]).filter(j=>j.fase!=='Entregue');
  lab.filter(j=>j.prazo<T).forEach(j=>out.push({ic:'🦷',chip:'red',ch:'Em atraso',t:`${j.tipo} — ${j.paciente}`,p:`A entrega era ${fmtDay(j.prazo)} e ainda está em ${j.fase.toLowerCase()}.`}));
  lab.filter(j=>j.prazo===T).forEach(j=>out.push({ic:'🦷',chip:'red',ch:'Hoje',t:`${j.tipo} — ${j.paciente}`,p:`Entrega HOJE · fase atual: ${j.fase}.`}));
  lab.filter(j=>j.prazo>T&&j.prazo<=isoAddDays(T,2)).forEach(j=>out.push({ic:'🦷',chip:'orange',ch:'Lab',t:`${j.tipo} — ${j.paciente}`,p:`Entrega ${fmtDay(j.prazo)} · ${j.fase}.`}));
  const alta=LS(K.tasks,[]).filter(t=>!t.done&&t.pri==='alta');
  if(alta.length)out.push({ic:'⚡',chip:'red',ch:'Tarefas',t:`${alta.length===1?'1 tarefa':alta.length+' tarefas'} de prioridade alta`,p:alta.slice(0,3).map(t=>t.t).join(' · ')+(alta.length>3?' …':'')});
  (_emailCache||[]).filter(e=>e.chip==='red').slice(0,3).forEach(e=>out.push({ic:'📧',chip:'red',ch:'Email urgente',t:e.as,p:senderName(e.de)}));
  (_calCache||[]).filter(e=>evISO(e)===T&&!e.allDay&&evHM(e)>=hm).slice(0,3).forEach(e=>out.push({ic:'📌',chip:'blue',ch:'Hoje',t:e.title,p:`às ${evHM(e)}${e.loc?' · '+e.loc:''}`}));
  const st=S();const mk=monthKey(now());const byCat={};
  LS(K.fin,[]).filter(t=>t.m===mk&&t.v<0).forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)-t.v);
  Object.entries(st.budgets).forEach(([c,b])=>{const v=byCat[c]||0;
    if(b>0&&v>=b)out.push({ic:'💶',chip:'orange',ch:'Orçamento',t:`${FIN_CATS[c].n}: orçamento ultrapassado`,p:`${eur(v)} de ${eur(b)} este mês.`})});
  /* segurança dos dados: lembra o backup a cada 30 dias */
  const hasData=LS(K.fin,[]).length||LS(K.tasks,[]).length||LS(K.lab,[]).length||Object.keys(LS(K.habits,{})).length;
  const lb=localStorage.getItem('fl_last_backup');
  if(hasData&&(!lb||isoAddDays(lb,30)<=T))
    out.push({ic:'💾',chip:'blue',ch:'Backup',t:'Faz um backup dos teus dados',p:`Os dados vivem só neste telemóvel. Exporta nas definições ⚙ — último backup: ${lb?fmtDay(lb):'nunca'}.`});
  return out;
}

  const items=buildAlerts();

/* ═══════════════ BACKUP ═══════════════ */
function exportBackup(){
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('fl_'))data[k]=localStorage.getItem(k)}
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`lifeos-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href);
  localStorage.setItem('fl_last_backup',todayISO());
  renderSide();
  toast('Backup exportado ⤓');
}
function resetAll(){
  if(!confirm('Apagar TODOS os dados e começar do zero?\n\nEsta ação é irreversível. Se quiseres guardar, exporta um backup primeiro.'))return;
  const keys=[];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('fl_'))keys.push(k)}
  keys.forEach(k=>localStorage.removeItem(k));
  toast('Dados apagados — a recarregar…');setTimeout(()=>location.reload(),700);
}
function importBackup(input){
  const f=input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const data=JSON.parse(rd.result);
    Object.entries(data).forEach(([k,v])=>{if(k.startsWith('fl_'))localStorage.setItem(k,v)});
    toast('Backup restaurado — a recarregar…');setTimeout(()=>location.reload(),900);
  }catch(e){toast('Ficheiro inválido')}};
  rd.readAsText(f);
}

/* ═══════════════ IA — Anthropic (on-device key) ═══════════════ */
/* Cadeia de modelos: tenta o preferido; se o modelo for rejeitado, cai para
   o seguinte. Assim que um funciona, fica memorizado (fl_ai_model). */
const AI_FALLBACKS=['claude-opus-4-8','claude-sonnet-4-5','claude-3-5-sonnet-latest','claude-3-5-haiku-latest'];
function aiModels(){
  const pref=localStorage.getItem('fl_ai_model');
  return [...new Set([pref,...AI_FALLBACKS].filter(Boolean))];
}
async function callAnthropic(key,model,prompt){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model,max_tokens:600,
      system:'És o assistente do Life OS de Filipe Lemos, prostético dentário de 35 anos no Faial, Açores. Responde SEMPRE em português de Portugal, de forma curta, prática e motivadora (máx. 5 frases).',
      messages:[{role:'user',content:prompt}]})});
  let body=null;try{body=await res.json()}catch(e){}
  if(!res.ok){
    const msg=(body&&body.error&&body.error.message)||('HTTP '+res.status);
    const modelIssue=res.status===404||/model/i.test(msg);
    const err=new Error(msg);err.status=res.status;err.modelIssue=modelIssue;throw err;
  }
  if(body&&body.stop_reason==='refusal')return 'O pedido foi recusado pelos filtros de segurança.';
  return (body&&body.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')||'(sem resposta)';
}
async function askClaude(prompt){
  const key=localStorage.getItem(K.key);
  if(!key)throw new Error('NOKEY');
  const models=aiModels();let lastErr=null;
  for(const m of models){
    try{
      const out=await callAnthropic(key,m,prompt);
      localStorage.setItem('fl_ai_model',m); /* memoriza o que funcionou */
      return out;
    }catch(e){
      lastErr=e;
      /* só continua para o próximo modelo se o problema for mesmo o modelo;
         chave inválida (401) ou rede não adianta re-tentar com outro modelo */
      if(!(e.modelIssue))throw e;
    }
  }
  throw lastErr||new Error('sem modelos disponíveis');
}
async function aiInsight(){
  haptic();
  if(!localStorage.getItem(K.key)){
    sheetOpen(`<h2>✦ Assistente IA</h2><p class="muted tiny" style="margin-bottom:14px">Para usar o insight diário, adiciona a tua chave API Anthropic nas definições. Fica só no teu dispositivo.</p><button class="btn full" onclick="openSettings()">Abrir definições</button>`);
    return;
  }
  const r=ringProg();const tasks=LS(K.tasks,[]).filter(t=>!t.done).map(t=>`${t.t} (${priOf(t).n})`);
  const lab=LS(K.lab,[]).filter(j=>j.fase!=='Entregue').map(j=>`${j.tipo} (${j.fase}, ${j.prazo})`);
  const ag=todayTimeline().map(x=>`${x.hLbl} ${x.t}`);
  sheetOpen(`<h2>✦ Insight do dia</h2><div class="ai-out" id="aiOut"><span class="thinking"><i></i><i></i><i></i></span></div>`);
  try{
    const txt=await askClaude(`Hoje é ${fmtLong(todayISO())}, são ${nowHM()}. Água ${r.water.toFixed(1)}/${r.st.waterGoal} L. Hábitos de hoje: ${r.hDone}/${r.hTot}. Agenda de hoje: ${ag.join('; ')||'vazia'}. Tarefas abertas: ${tasks.join('; ')||'nenhuma'}. Trabalhos de lab: ${lab.join('; ')||'nenhum'}. Dá-me um insight/plano curto para o resto do dia.`);
    const out=document.getElementById('aiOut');if(out)out.textContent=txt;
  }catch(e){
    const out=document.getElementById('aiOut');if(!out)return;
    if(e.message==='NOKEY'){out.textContent='Falta a chave API nas definições.';return}
    const msg=e.message||'';
    const billing=/credit|balance|billing|quota|insufficient/i.test(msg);
    let hint='',btn=`<button class="btn sm" onclick="openSettings()">Abrir definições</button>`;
    if(billing){
      hint='A tua chave é válida, mas a conta de <b>API da Anthropic</b> não tem créditos. Atenção: isto é diferente do <b>Claude Plus</b> (a subscrição do chat) — a API é paga à parte, com créditos pré-carregados em console.anthropic.com → Plans &amp; Billing. O Insight IA é a única parte da app que precisa disto; tudo o resto funciona sem.';
      btn='';
    }
    else if(e.status===401)hint='A chave API parece inválida ou foi revogada — mete uma nova nas definições ⚙.';
    else if(e.status===404||e.modelIssue)hint='O teu acesso não inclui este modelo. Escolhe outro nas definições ⚙.';
    else if(e.status===429)hint='Demasiados pedidos num curto espaço de tempo — tenta daqui a pouco.';
    else hint='Verifica a ligação à internet.';
    out.innerHTML=`<b style="color:var(--red)">Não consegui gerar o insight.</b><br><span class="tiny muted">${esc(msg||'erro desconhecido')}</span><br><br>${hint}${btn?'<br><br>'+btn:''}`;
  }
}

/* ═══════════════ METEO — Horta (open-meteo, com fallback offline) ═══════════════ */
async function loadWeather(){
  const ICONS={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',61:'🌧',63:'🌧',65:'🌧',80:'🌦',95:'⛈'};
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=38.53&longitude=-28.63&current=temperature_2m,weather_code&timezone=Atlantic%2FAzores');
    const j=await r.json();
    const t=Math.round(j.current.temperature_2m);
    save('fl_wx_cache',{t,c:j.current.weather_code});
    document.getElementById('wxT').textContent=t+'°';
    document.getElementById('wxIc').textContent=ICONS[j.current.weather_code]||'⛅';
  }catch(e){
    const c=LS('fl_wx_cache',null);
    if(c){document.getElementById('wxT').textContent=c.t+'°';document.getElementById('wxIc').textContent=ICONS[c.c]||'⛅'}
    else document.getElementById('wxT').textContent='—';
  }
}

/* ═══════════════ TEMA ═══════════════ */
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  localStorage.setItem(K.theme,t);
  document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0a0a0a':'#f4f4f2';
  syncStatusBar();
  Object.values(_charts).forEach(c=>c&&c.destroy());_charts={};
  const on=document.querySelector('nav button.on');
  window._ringsAnimated=true;
  go(on.dataset.sec,on);
}
/* barra de estado Android acompanha o tema */
async function syncStatusBar(){
  try{
    const C=window.Capacitor;
    if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
    const {StatusBar}=C.Plugins;if(!StatusBar)return;
    const dark=document.documentElement.dataset.theme!=='light';
    await StatusBar.setBackgroundColor({color:dark?'#0a0a0a':'#f4f4f2'});
    await StatusBar.setStyle({style:dark?'DARK':'LIGHT'});
  }catch(e){}
}
function toggleTheme(){haptic();applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}

/* ═══════════════ NATIVO — Capacitor ═══════════════ */
async function initNative(){
  const C=window.Capacitor;
  if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
  syncStatusBar();
  try{
    const {App}=C.Plugins;
    if(App)App.addListener('backButton',({canGoBack})=>{
      const anyOpen=document.querySelector('.sheet.on,.side.on');
      if(anyOpen){closeAll();return}
      const on=document.querySelector('nav button.on');
      if(on&&on.dataset.sec!=='home'){go('home',document.querySelector('[data-sec="home"]'))}
      else App.exitApp();
    });
  }catch(e){}
}
