<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Life OS</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ═══════════════ DESIGN SYSTEM — Nothing OS ═══════════════ */
:root{
  --bg:#0a0a0a; --surface:#141414; --surface2:#1c1c1c; --surface3:#262626;
  --txt:#f2f2f2; --txt2:#9a9a9a; --txt3:#5c5c5c;
  --border:#232323; --border2:#333; --track:#222; --dot:#1f1f1f;
  --green:#21b573; --blue:#4f7cf7; --purple:#9b6dff; --orange:#ff8a3d;
  --yellow:#ffd166; --red:#ff5c5c; --pink:#ff6fae;
  --r:20px; --rsm:14px; --rxs:9px;
  --shadow:0 8px 30px rgba(0,0,0,.4);
}
[data-theme="light"]{
  --bg:#f4f4f2; --surface:#ffffff; --surface2:#f0f0ee; --surface3:#e6e6e3;
  --txt:#111; --txt2:#666; --txt3:#a3a3a3;
  --border:#e4e4e1; --border2:#d4d4d0; --track:#e8e8e5; --dot:#dcdcd8;
  --shadow:0 8px 30px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--txt);
  background-image:radial-gradient(circle,var(--dot) 1.2px,transparent 1.2px);
  background-size:22px 22px; min-height:100vh; font-size:15px;
  transition:background-color .35s,color .35s;
  padding-bottom:calc(env(safe-area-inset-bottom) + 8px);
}
.doto{font-family:'Doto',monospace;font-weight:700;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--rxs);padding:9px 12px;outline:none;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--txt2)}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ── topbar ── */
.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Doto';font-weight:900;font-size:19px;letter-spacing:2px}
.brand em{font-style:normal;color:var(--txt3)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(33,181,115,.5);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(33,181,115,.45)}70%{box-shadow:0 0 0 9px rgba(33,181,115,0)}100%{box-shadow:0 0 0 0 rgba(33,181,115,0)}}
.top-r{display:flex;align-items:center;gap:6px}
.wx{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt2);padding:5px 10px;border:1px solid var(--border);border-radius:99px;background:var(--surface)}
.wx b{font-family:'Doto';font-size:14px;color:var(--txt)}
.icobtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:15px;color:var(--txt2);position:relative;transition:transform .15s,border-color .2s}
.icobtn:active{transform:scale(.88)}
.icobtn .badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:'Doto'}
.datebar{padding:14px 18px 2px;display:flex;align-items:baseline;justify-content:space-between}
.datebar h1{font-size:22px;font-weight:700;letter-spacing:-.4px}
.datebar .clock{font-family:'Doto';font-weight:900;font-size:22px;letter-spacing:1px}
.datebar small{display:block;color:var(--txt2);font-weight:400;font-size:13px;margin-top:2px;text-transform:capitalize}

/* ── nav ── */
nav{position:sticky;top:calc(env(safe-area-inset-top) + 58px);z-index:55;display:flex;gap:6px;overflow-x:auto;padding:10px 18px;scrollbar-width:none;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px)}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:1px solid var(--border);
  background:var(--surface);color:var(--txt2);font-size:13px;font-weight:600;white-space:nowrap;transition:all .25s cubic-bezier(.2,.8,.2,1)}
nav button.on{background:var(--txt);color:var(--bg);border-color:var(--txt);transform:scale(1.03)}
nav button:active{transform:scale(.94)}

/* ── layout ── */
main{padding:6px 18px 30px;max-width:760px;margin:0 auto}
.sec{display:none}
.sec.on{display:block;animation:fadeUp .4s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.card h3{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--txt3);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.card h3 .act{font-size:11px;color:var(--txt2);letter-spacing:.4px;text-transform:none;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.muted{color:var(--txt2)}.tiny{font-size:12px}.xs{font-size:11px}
.spacer{height:4px}

/* ── KPI tiles ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--rsm);padding:14px 15px}
.kpi .lbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt3);display:flex;align-items:center;gap:6px}
.kpi .lbl i{width:7px;height:7px;border-radius:50%;flex:0 0 auto;font-style:normal}
.kpi .val{font-family:'Doto';font-weight:900;font-size:25px;margin-top:7px;letter-spacing:.5px}
.kpi .sub{font-size:11px;color:var(--txt2);margin-top:3px}
.up{color:var(--green)}.down{color:var(--red)}

/* ── progress bars ── */
.bar{height:7px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--txt);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.brow{margin-bottom:12px}
.brow:last-child{margin-bottom:0}
.brow .bt{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.brow .bt b{font-weight:600}
.brow .bt .doto{font-size:13px}

/* ── rings ── */
.rings-wrap{display:flex;align-items:center;gap:20px}
.rings{flex:0 0 auto}
.rings svg{display:block}
.rings circle{fill:none;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.rlegend{flex:1;display:flex;flex-direction:column;gap:11px}
.rlegend .rl{display:flex;align-items:center;gap:10px}
.rlegend .rl i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.rlegend .rl .rlt{flex:1}
.rlegend .rl .rlt b{display:block;font-size:12.5px;font-weight:600}
.rlegend .rl .rlt span{font-size:11px;color:var(--txt2)}
.rlegend .rl .doto{font-size:17px;font-weight:900}

/* ── list items ── */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);animation:slideIn .35s both}
.li:last-child{border-bottom:none}
.li .ic{width:38px;height:38px;border-radius:var(--rxs);background:var(--surface2);border:1px solid var(--border);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.li .bd{flex:1;min-width:0}
.li .bd b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .bd span{font-size:11.5px;color:var(--txt2)}
.li .tm{font-family:'Doto';font-weight:700;font-size:13px;color:var(--txt2);flex:0 0 auto}
.li.done .bd b{text-decoration:line-through;color:var(--txt3)}
.chk{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--border2);flex:0 0 auto;display:grid;place-items:center;font-size:11px;color:transparent;transition:all .25s}
.chk.c{background:var(--green);border-color:var(--green);color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.3px}
.chip.red{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.chip.orange{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.chip.green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.chip.blue{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.chip.purple{background:color-mix(in srgb,var(--purple) 16%,transparent);color:var(--purple)}
.chip.gray{background:var(--surface3);color:var(--txt2)}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:var(--rsm);font-size:13.5px;font-weight:700;
  background:var(--txt);color:var(--bg);transition:transform .15s,opacity .2s;border:1px solid transparent}
.btn:active{transform:scale(.95)}
.btn.ghost{background:transparent;color:var(--txt);border-color:var(--border2)}
.btn.sm{padding:7px 13px;font-size:12px;border-radius:10px}
.btn.full{width:100%}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1}

/* ── agenda timeline ── */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:repeating-linear-gradient(to bottom,var(--border2) 0 4px,transparent 4px 9px)}
.tl .li{border:none;padding:9px 0}
.tl .li::before{content:'';position:absolute;left:-20.5px;margin-top:2px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2.5px solid var(--txt3)}
.tl .li.now::before{border-color:var(--green);background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 22%,transparent)}
.tl .li{position:relative}

/* ── habit grid ── */
.hgrid{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.hgrid .hlabel{grid-column:1/-1;font-size:11px;color:var(--txt2);font-weight:600;margin:8px 0 2px;display:flex;justify-content:space-between}
.hcell{aspect-ratio:1;border-radius:5px;background:var(--track);transition:transform .15s;cursor:pointer;border:1px solid transparent}
.hcell.on{background:var(--green)}
.hcell.today{border-color:var(--txt2)}
.hcell:active{transform:scale(.8)}
.streak{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--surface2);margin-bottom:14px}
.streak .fl{font-size:30px}
.streak .doto{font-size:30px;font-weight:900}

/* ── finance ── */
.fin-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.fin-nav b{font-size:16px;font-weight:700;text-transform:capitalize}
.fin-nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--txt2);font-size:15px}
.catbar{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.catbar .ci{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.catbar .cb{flex:1}
.catbar .cb .ct{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.catbar .cb .ct b{font-weight:600}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:0 0 auto;padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface2);color:var(--txt2);font-size:11.5px;font-weight:600}
.fchips button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.tx{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);animation:slideIn .3s both}
.tx:last-child{border:none}
.tx .amt{font-family:'Doto';font-weight:900;font-size:15px;flex:0 0 auto}
.chartbox{position:relative;height:190px;margin-top:6px}

/* ── drawers / sheets ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(3px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:95;background:var(--surface);border:1px solid var(--border);border-bottom:none;
  border-radius:26px 26px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);
  padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4.5px;border-radius:99px;background:var(--border2);margin:6px auto 16px}
.sheet h2{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.frow{margin-bottom:13px}
.frow label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);margin-bottom:6px}
.frow .hint{font-size:11px;color:var(--txt3);margin-top:5px;line-height:1.5}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.divider{height:1px;background:var(--border);margin:20px 0}
.side{position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);z-index:95;background:var(--surface);border-left:1px solid var(--border);
  transform:translateX(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 18px) 18px 30px}
.side.on{transform:none}
.side h2{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.side .sub{font-size:12px;color:var(--txt2);margin-bottom:16px}
.alert{border:1px solid var(--border);border-radius:var(--rsm);padding:13px;margin-bottom:10px;background:var(--surface2);animation:slideIn .35s both}
.alert b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.alert p{font-size:12px;color:var(--txt2);line-height:1.5}
.alert .chip{margin-bottom:7px}

/* ── AI panel ── */
.ai-out{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rsm);padding:14px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;min-height:60px;color:var(--txt)}
.thinking{display:inline-flex;gap:4px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--txt2);animation:th 1s infinite}
.thinking i:nth-child(2){animation-delay:.18s}.thinking i:nth-child(3){animation-delay:.36s}
@keyframes th{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

/* ── toast ── */
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 22px);left:50%;transform:translate(-50%,80px);z-index:120;
  background:var(--txt);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:all .35s cubic-bezier(.2,.9,.25,1);box-shadow:var(--shadow);white-space:nowrap}
#toast.on{transform:translate(-50%,0);opacity:1}
.empty{text-align:center;color:var(--txt3);font-size:13px;padding:26px 0}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="pulse"></span>LIFE<em>OS</em></div>
  <div class="top-r">
    <div class="wx" id="wx"><span id="wxIc">⛅</span><b class="doto" id="wxT">—</b><span id="wxD">Horta</span></div>
    <button class="icobtn" id="alertsBtn" aria-label="Alertas">◉<span class="badge" id="alertBadge">0</span></button>
    <button class="icobtn" id="themeBtn" aria-label="Tema">◐</button>
    <button class="icobtn" id="setBtn" aria-label="Definições">⚙</button>
  </div>
</header>

<div class="datebar">
  <h1 id="greet">Olá, Filipe<small id="dateStr"></small></h1>
  <div class="clock" id="clock">--:--</div>
</div>

<nav id="nav">
  <button data-sec="home" class="on" onclick="go('home',this)">🏠 Hoje</button>
  <button data-sec="agenda" onclick="go('agenda',this)">📅 Agenda</button>
  <button data-sec="tasks" onclick="go('tasks',this)">✅ Tarefas</button>
  <button data-sec="emails" onclick="go('emails',this)">📧 Emails</button>
  <button data-sec="habits" onclick="go('habits',this)">📊 Hábitos</button>
  <button data-sec="proj" onclick="go('proj',this)">🚀 Projetos</button>
  <button data-sec="lab" onclick="go('lab',this)">🔬 Laboratório</button>
  <button data-sec="fin" onclick="go('fin',this)">💰 Finanças</button>
</nav>

<main>
  <section id="sec-home" class="sec on"></section>
  <section id="sec-agenda" class="sec"></section>
  <section id="sec-tasks" class="sec"></section>
  <section id="sec-emails" class="sec"></section>
  <section id="sec-habits" class="sec"></section>
  <section id="sec-proj" class="sec"></section>
  <section id="sec-lab" class="sec"></section>
  <section id="sec-fin" class="sec"></section>
</main>

<div class="scrim" id="scrim" onclick="closeAll()"></div>

<aside class="side" id="side">
  <h2>A precisar de ti <button class="icobtn" onclick="closeAll()">✕</button></h2>
  <div class="sub">Alertas, notícias e pendentes</div>
  <div id="sideBody"></div>
</aside>

<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<div id="toast"></div>

<script>
/* ═══════════════ LIFE OS — núcleo ═══════════════ */
'use strict';
const TZ='Atlantic/Azores';
const K={tasks:'fl_tasks_v3',fin:'fl_fin_v1',set:'fl_settings_v1',habits:'fl_habits_v1',workouts:'fl_workouts_v2',
  meals:'fl_meals_v2',weight:'fl_weight_v1',water:'fl_water_v1',sleep:'fl_sleep_v1',run:'fl_run_done_v1',
  social:'fl_social_v1',lab:'fl_lab_v1',labnotes:'fl_labnotes_v1',proj:'fl_proj_v1',read:'fl_read_v1',
  eod:'fl_eod_v1',mcl:'fl_mcl_v1',theme:'fl_theme',key:'fl_anthropic_key'};

const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

const DEFAULT_SETTINGS={
  name:'Filipe', startWeight:95, goalWeight:73, height:1.69,
  waterGoal:2.5, fastGoal:14, kcalGoal:1900, protGoal:150,
  budgets:{hab:650,ali:400,tra:180,sau:120,sub:60,pes:150,mat:250,out:100}
};
const getSettings=()=>({...DEFAULT_SETTINGS,...LS(K.set,{}),budgets:{...DEFAULT_SETTINGS.budgets,...(LS(K.set,{}).budgets||{})}});
const S=getSettings;

/* datas pt-PT no fuso dos Açores */
const now=()=>new Date();
const azParts=d=>{const p={};new Intl.DateTimeFormat('pt-PT',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).forEach(x=>p[x.type]=x.value);return p};
const todayISO=()=>{const p=azParts(now());return `${p.year}-${p.month}-${p.day}`};
const isoAddDays=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const weekStartISO=()=>{const d=new Date(todayISO()+'T12:00:00Z');const dow=(d.getUTCDay()+6)%7;return isoAddDays(todayISO(),-dow)}; /* 2ª feira */
const fmtDay=iso=>new Intl.DateTimeFormat('pt-PT',{timeZone:'UTC',weekday:'short',day:'numeric'}).format(new Date(iso+'T12:00:00Z'));
const fmtLong=iso=>new Intl.DateTimeFormat('pt-PT',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'}).format(new Date(iso+'T12:00:00Z'));

/* ── countUp: números que contam do 0 ── */
function countUp(el,target,{dec=0,suffix='',prefix='',dur=1100}={}){
  if(!el)return;
  const t0=performance.now();
  const step=t=>{
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); /* easeOutCubic */
    const v=target*e;
    el.textContent=prefix+v.toLocaleString('pt-PT',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suffix;
    if(p<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const staticNum=(v,dec=0,suffix='',prefix='')=>prefix+v.toLocaleString('pt-PT',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suffix;

  try{
    const C=window.Capacitor;
    if(C&&C.Plugins&&C.Plugins.Haptics){C.Plugins.Haptics.impact({style:style==='light'?'LIGHT':'MEDIUM'});return}
    if(navigator.vibrate)navigator.vibrate(8);
  }catch(e){}
}

/* Mostra o erro real do login (código incluído) num ecrã, para diagnóstico. */
function googleErr(e){
  const lines=[];
  try{
    if(e==null)lines.push('(erro vazio)');
    else{
      if(e.message)lines.push('message: '+e.message);
      if(e.code!==undefined)lines.push('code: '+e.code);
      if(e.errorMessage)lines.push('errorMessage: '+e.errorMessage);
      const raw=JSON.stringify(e,Object.getOwnPropertyNames(e));
      if(raw&&raw!=='{}')lines.push('raw: '+raw);
      if(!lines.length)lines.push(String(e));
    }
  }catch(_){lines.push(String(e))}
  const codeHint=(String(e&&(e.code||e.message))||'').match(/\b(10|12500|12501|12502|7|8)\b/);
  let dica='';
  if(codeHint){const c=codeHint[1];
    if(c==='10')dica='Código 10 = DEVELOPER_ERROR: a credencial Android não existe ou o pacote/SHA-1 não batem certo (ou ainda não propagou).';
    else if(c==='12501')dica='Código 12501: login cancelado pelo utilizador.';
    else if(c==='12500')dica='Código 12500: falha de configuração do Sign-In (consent screen / test user).';
    else if(c==='7')dica='Código 7: sem rede.';
  }
  sheetOpen(`<h2>⚠ Erro no login Google</h2>
    <div class="ai-out" style="font-size:12px;white-space:pre-wrap;word-break:break-word">${esc(lines.join('\n'))}</div>
    ${dica?`<div class="hint" style="margin-top:10px">${esc(dica)}</div>`:''}
    <div class="hint" style="margin-top:8px">Faz uma captura deste ecrã e envia — dá-me o código exato para resolver.</div>`);
}

/* categorização por urgência (heurística pt/en) — vermelho→cinzento */
function classifyEmail(from,subject,snippet,unread){
  const s=((subject||'')+' '+(snippet||'')+' '+(from||'')).toLowerCase();
  const has=(...w)=>w.some(x=>s.includes(x));
  const promo=has('newsletter','unsubscribe','cancelar subscri','promo','desconto','discount','% off','sale','coupon','cupão','waitlist','webinar');
  const pessoal=has('inscri','corrida','clube','maratona','convite','aniversár','birthday');
  if(has('urgente','urgent','vence','expira','expire','ação necessária','action required','último dia','last day','prazo','overdue','em atraso','suspens','2 days','2 dias','24 hour','24 hora'))
    return {chip:'red',ch:'Urgente',ic:'🔴'};
  if(has('fatura','invoice','recibo','pagamento','payment','seguro','renova','subscri','preço','price','segurança social','finanças','autoridade tribut','banco','extrato','débito'))
    return {chip:'orange',ch:'Requer ação',ic:'🟠'};
  if(pessoal) return {chip:'green',ch:'Pessoal',ic:'🟢'};
  if(promo) return {chip:'gray',ch:'Informativo',ic:'⚪'};
  if(unread) return {chip:'blue',ch:'Ler depois',ic:'🔵'};
  return {chip:'gray',ch:'Informativo',ic:'⚪'};
}

function ringProg(){
  const st=S();
  const tasks=LS(K.tasks,[]); const ws=weekStartISO();
  /* semana: abertas + concluídas esta semana (planeamento semanal) */
  const tDone=tasks.filter(t=>t.done&&t.doneAt&&t.doneAt>=ws).length;
  const tTot=tasks.filter(t=>!t.done).length+tDone;
  const pTasks=tTot?tDone/tTot:0;
  const H=LS(K.habits,{}); const hk=Object.keys(H); const hDone=hk.filter(n=>H[n][todayISO()]).length;
  const pHab=hk.length?hDone/hk.length:0;
  const water=LS(K.water,{})[todayISO()]||0; const pWater=Math.min(1,water/st.waterGoal);
  return {pTasks,tDone,tTot,pHab,hDone,hTot:hk.length,water,pWater,st};
}
function ringsSVG(r){
  const size=150,cx=size/2;
  const ring=(rad,color,p,delay)=>{
    const c=2*Math.PI*rad;
    return `<circle cx="${cx}" cy="${cx}" r="${rad}" stroke="var(--track)" stroke-width="11"></circle>
      <circle class="rp" data-p="${p}" data-c="${c}" cx="${cx}" cy="${cx}" r="${rad}" stroke="${color}" stroke-width="11"
        stroke-dasharray="${c}" stroke-dashoffset="${c}" style="transition-delay:${delay}ms"></circle>`;
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${ring(64,'var(--green)',r.pTasks,0)}${ring(50,'var(--purple)',r.pHab,120)}${ring(36,'var(--blue)',r.pWater,240)}
  </svg>`;
}
function animateRings(scope){
  const run=()=>scope.querySelectorAll('.rp').forEach(el=>{
    el.style.strokeDashoffset=(+el.dataset.c)*(1-Math.min(1,+el.dataset.p));
  });
  if(window._ringsAnimated){scope.querySelectorAll('.rp').forEach(el=>el.style.transition='none');run();}
  else{requestAnimationFrame(()=>requestAnimationFrame(run));window._ringsAnimated=true;}
}
function fillBars(scope,animate){
  scope.querySelectorAll('.bar i').forEach(el=>{
    if(!animate)el.style.transition='none';
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.width=el.dataset.w));
  });
}
function nums(scope,animate){
  scope.querySelectorAll('[data-num]').forEach(el=>{
    const v=+el.dataset.num,dec=+(el.dataset.dec||0),suf=el.dataset.suf||'',pre=el.dataset.pre||'';
    if(animate)countUp(el,v,{dec,suffix:suf,prefix:pre});
    else el.textContent=staticNum(v,dec,suf,pre);
  });
}

function calConnect(){
  if(isNative()){
    (async()=>{try{setGoogleToken(await nativeGoogleToken());calRefresh()}
    catch(e){googleErr(e)}})();
    return;
  }
  if(!(window.google&&google.accounts&&google.accounts.oauth2))
    return toast('Google indisponível — precisas de ligação');
  try{
    const tc=google.accounts.oauth2.initTokenClient({
      client_id:gmailClientId(),scope:CAL_SCOPE,
      callback:(r)=>{if(r&&r.access_token){_calTok=r.access_token;try{sessionStorage.setItem('fl_cal_tok',r.access_token)}catch(e){}calRefresh()}else toast('Autorização cancelada')}
    });
    tc.requestAccessToken();
  }catch(e){toast('Falha ao iniciar login Google')}
}
async function calRefresh(){
  const tok=_calTok||sessionStorage.getItem('fl_cal_tok');
  if(!tok)return calConnect();
  const timeMin=new Date().toISOString();
  const timeMax=new Date(Date.now()+1000*60*60*24*30).toISOString();
  const url='https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=25'
    +'&timeMin='+encodeURIComponent(timeMin)+'&timeMax='+encodeURIComponent(timeMax);
  try{
    const r=await fetch(url,{headers:{Authorization:'Bearer '+tok}});
    if(r.status===401){_calTok=null;sessionStorage.removeItem('fl_cal_tok');_calCache=null;toast('Sessão expirou — liga outra vez');return renderAgenda()}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    _calCache=(j.items||[]).filter(ev=>ev.status!=='cancelled').map(ev=>({
      title:ev.summary||'(sem título)',loc:ev.location||'',
      start:ev.start.dateTime||ev.start.date,allDay:!ev.start.dateTime}));
    renderAgenda();toast(`${_calCache.length} marcações ✓`);
  }catch(e){_calCache=[];renderAgenda();toast('Erro no calendário: '+e.message)}
}

function renderTasks(){

    <h3>Progresso <span class="act doto">${done}/${tot}</span></h3>

  </div>

function toggleTask(id,back){haptic();const t=LS(K.tasks,[]);const x=t.find(y=>y.id===id);

function addTask(){const i=document.getElementById('taskIn');const v=i.value.trim();if(!v)return;

function delTask(id){save(K.tasks,LS(K.tasks,[]).filter(t=>t.id!==id));renderTasks()}

async function gmailRefresh(){
  const tok=_gmailTok||sessionStorage.getItem('fl_gmail_tok');
  if(!tok)return gmailConnect();
  const el=document.getElementById('sec-emails');
  el.innerHTML=`<div class="card"><h3>📧 Emails</h3><div class="ai-out"><span class="thinking"><i></i><i></i><i></i></span> a carregar do Gmail…</div></div>`;
  try{
    const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=18&q=in%3Ainbox',{headers:{Authorization:'Bearer '+tok}});
    if(r.status===401){_gmailTok=null;sessionStorage.removeItem('fl_gmail_tok');_emailCache=null;toast('Sessão expirou — liga outra vez');return renderEmails()}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const {messages}=await r.json();
    const out=[];
    for(const m of (messages||[]).slice(0,18)){
      const d=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+m.id+'?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date',{headers:{Authorization:'Bearer '+tok}});
      if(!d.ok)continue;
      const j=await d.json();const h={};(j.payload&&j.payload.headers||[]).forEach(x=>h[x.name.toLowerCase()]=x.value);
      const unread=(j.labelIds||[]).includes('UNREAD');
      const cat=classifyEmail(h.from,h.subject,j.snippet,unread);
      const dt=h.date?new Date(h.date):null;
      out.push({de:h.from||'',as:h.subject||'(sem assunto)',snippet:j.snippet||'',unread,
        chip:cat.chip,ch:cat.ch,ic:cat.ic,h:dt?new Intl.DateTimeFormat('pt-PT',{day:'2-digit',month:'2-digit'}).format(dt):''});
    }
    const order={red:0,orange:1,blue:2,green:3,gray:4};
    out.sort((a,b)=>order[a.chip]-order[b.chip]);
    _emailCache=out;window._emailsAnim=false;renderEmails();
    toast(`${out.length} emails carregados ✓`);
  }catch(e){
    _emailCache=[];renderEmails();toast('Erro ao ler o Gmail: '+e.message);
  }
}

/* ═══════════════ HÁBITOS ═══════════════ */
function bestStreak(){
  const H=LS(K.habits,{});let best=0;
  Object.values(H).forEach(days=>{
    let s=0;for(let d=0;d<60;d++){if(days[isoAddDays(todayISO(),-d)])s++;else break}
    best=Math.max(best,s);
  });return best;
}

  const el=document.getElementById('sec-habits');
  const H=LS(K.habits,{});const days=[...Array(14)].map((_,i)=>isoAddDays(todayISO(),-(13-i)));

  el.innerHTML=`
  <div class="streak"><span class="fl">🔥</span><div><div class="doto" data-num="${bestStreak()}"></div><div class="tiny muted">dias consecutivos — melhor hábito</div></div></div>
  <div class="card"><h3>Grelha 14 dias <span class="act">${fmtDay(days[0])} → hoje</span></h3>
    <div class="hgrid">

      ${days.map(x=>`<div class="hcell ${d[x]?'on':''} ${x===todayISO()?'today':''}" onclick="toggleHabit('${en}','${x}')"></div>`).join('')}`}).join('')||'<div class="empty" style="grid-column:1/-1;padding:16px 0">Sem hábitos — adiciona o primeiro 👇</div>'}
    </div>

  </div>
  <div class="card"><h3>Consistência diária</h3><div class="chartbox" style="height:150px"><canvas id="hChart"></canvas></div></div>
  <div class="card"><h3>Insights</h3>
    ${habitInsights().map((s,i)=>`<div class="li" style="animation-delay:${i*70}ms"><div class="ic">${s.ic}</div><div class="bd"><b>${s.t}</b><span>${s.s}</span></div></div>`).join('')}

function toggleHabit(nameEnc,d){haptic();const name=decodeURIComponent(nameEnc);const H=LS(K.habits,{});if(!H[name])H[name]={};H[name][d]=!H[name][d];save(K.habits,H);renderHabits()}
function addHabit(){
  const i=document.getElementById('habIn');const v=i.value.trim();if(!v)return;
  const H=LS(K.habits,{});if(H[v])return toast('Esse hábito já existe');
  H[v]={};save(K.habits,H);renderHabits();toast('Hábito adicionado ✓');
}
function delHabit(nameEnc){
  const name=decodeURIComponent(nameEnc);
  if(!confirm('Apagar o hábito "'+name+'" e o seu histórico?'))return;
  const H=LS(K.habits,{});delete H[name];save(K.habits,H);renderHabits();toast('Hábito apagado');
}
function habitInsights(){
  const H=LS(K.habits,{});const out=[];
  const rates=Object.entries(H).map(([n,d])=>{
    const days=[...Array(14)].map((_,i)=>isoAddDays(todayISO(),-i));
    return [n,days.filter(x=>d[x]).length/14];
  }).sort((a,b)=>b[1]-a[1]);
  if(rates[0])out.push({ic:'🏆',t:`${rates[0][0]} é o teu hábito mais forte`,s:`${Math.round(rates[0][1]*100)}% de consistência nas últimas 2 semanas`});
  const weak=rates[rates.length-1];
  if(weak&&weak[1]<0.6)out.push({ic:'🎯',t:`Foco em: ${weak[0]}`,s:`Apenas ${Math.round(weak[1]*100)}% — tenta ancorá-lo a um hábito forte`});
  out.push({ic:'🔥',t:`Streak atual: ${bestStreak()} dias`,s:'Não quebres a corrente'});
  return out;
}
function drawHabitChart(days,totals,max){
  if(!window.Chart)return;const ctx=document.getElementById('hChart');if(!ctx)return;
  if(_charts.h)_charts.h.destroy();const t=chartTheme();
  _charts.h=new Chart(ctx,{type:'bar',
    data:{labels:days.map(d=>d.slice(8)),datasets:[{data:totals,backgroundColor:t.purple,borderRadius:4,barPercentage:.62}]},
    options:{...baseOpts(t),scales:{...baseOpts(t).scales,y:{...baseOpts(t).scales.y,max:max,ticks:{...baseOpts(t).scales.y.ticks,stepSize:1}}}}});
}

    ${p.todos.map((t,j)=>`<div class="li ${t.done?'done':''}">
      <button class="chk ${t.done?'c':''}" onclick="toggleProjTodo(${p.id},${j})">✓</button>
      <div class="bd"><b>${esc(t.t)}</b></div></div>`).join('')||'<div class="empty" style="padding:12px 0">Ainda sem passos — adiciona o primeiro</div>'}

  </div>`).join('')||'<div class="empty">Sem projetos — cria o primeiro 👇</div>')

function toggleProjTodo(pid,j){haptic();const P=LS(K.proj,[]);const p=P.find(x=>x.id===pid);
  p.todos[j].done=!p.todos[j].done;
  p.prog=p.todos.length?Math.round(p.todos.filter(t=>t.done).length/p.todos.length*100):0;
  save(K.proj,P);renderProj()}
function addProjTodo(pid){
  const i=document.getElementById('ptIn'+pid);const v=i.value.trim();if(!v)return;
  const P=LS(K.proj,[]);const p=P.find(x=>x.id===pid);if(!p)return;
  p.todos.push({t:v,done:false});
  p.prog=Math.round(p.todos.filter(t=>t.done).length/p.todos.length*100);
  save(K.proj,P);renderProj();toast('Passo adicionado');
}

function createProj(){

function openLabPhase(id){

}
function openDelivered(){
  haptic();
  const J=LS(K.lab,[]).filter(j=>j.fase==='Entregue');
  const groups={};
  J.forEach(j=>{const mk=((j.entregueEm||j.prazo)||'').slice(0,7);if(mk)(groups[mk]=groups[mk]||[]).push(j)});

      <span class="doto tiny" style="color:var(--green)">${groups[mk].length} entrega${groups[mk].length>1?'s':''}</span>
    </div>

        <div class="bd"><b>${esc(j.tipo)}</b><span>${esc(j.paciente)} · ${esc(j.clinica)}</span></div>

function delDelivered(id){
  if(!confirm('Remover esta entrega do registo?'))return;
  save(K.lab,LS(K.lab,[]).filter(x=>x.id!==id));
  openDelivered();renderLab();toast('Removida do registo');
}
function delLab(id){
  const j=LS(K.lab,[]).find(x=>x.id===id);
  if(!confirm('Apagar o trabalho'+(j?' de '+j.paciente:'')+'? Esta ação é irreversível.'))return;
  save(K.lab,LS(K.lab,[]).filter(x=>x.id!==id));closeAll();renderLab();toast('Trabalho apagado');

function delLabNote(idx){
  const N=LS(K.labnotes,[]);N.splice(idx,1);save(K.labnotes,N);renderLab();toast('Nota apagada');
}
function setLabPhase(id,f){
  const J=LS(K.lab,[]);const j=J.find(x=>x.id===id);if(!j)return;
  j.fase=f;
  if(f==='Entregue')j.entregueEm=todayISO();else delete j.entregueEm;
  save(K.lab,J);closeAll();renderLab();
  toast(f==='Entregue'?`${j.paciente}: entregue ✓`:`${j.paciente}: ${f}`);
}
function addLabNote(){const i=document.getElementById('labNoteIn');const v=i.value.trim();if(!v)return;

function shiftMonth(n){const[y,m]=_finMonth.split('-').map(Number);const d=new Date(y,m-1+n,15);_finMonth=monthKey(d);window._finAnimated=false;renderFin()}
function setFinFilter(f){_finFilter=f;renderFin()}

  const el=document.getElementById('sec-fin');

  const inc=tx.filter(t=>t.v>0).reduce((a,t)=>a+t.v,0);
  const exp=-tx.filter(t=>t.v<0).reduce((a,t)=>a+t.v,0);

  const st=S();
  /* breakdown por categoria (despesas) */
  const byCat={};tx.filter(t=>t.v<0).forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)-t.v);

  const shown=_finFilter==='all'?tx:tx.filter(t=>t.cat===_finFilter);
  el.innerHTML=`
  <div class="fin-nav">
    <button onclick="shiftMonth(-1)">‹</button><b>${monthLabel(_finMonth)}</b><button onclick="shiftMonth(1)">›</button>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="lbl"><i style="background:var(--green)"></i>Receitas</div><div class="val" style="color:var(--green)" data-num="${Math.round(inc)}" data-suf=" €"></div></div>
    <div class="kpi"><div class="lbl"><i style="background:var(--red)"></i>Despesas</div><div class="val" style="color:var(--red)" data-num="${Math.round(exp)}" data-suf=" €"></div></div>
    <div class="kpi"><div class="lbl"><i style="background:var(--blue)"></i>Saldo</div><div class="val" data-num="${Math.round(saldo)}" data-suf=" €"></div></div>
    <div class="kpi"><div class="lbl"><i style="background:var(--purple)"></i>Poupança</div><div class="val" data-num="${poup}" data-suf="%"></div></div>
  </div>
  <div class="card"><h3>Cash flow — últimos 6 meses</h3><div class="chartbox"><canvas id="finChart"></canvas></div></div>
  <div class="card"><h3>Por categoria</h3>
    ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{const C=FIN_CATS[c];
      return `<div class="catbar"><div class="ci" style="background:color-mix(in srgb,${C.c} 15%,transparent);color:${C.c}">${C.ic}</div>
      <div class="cb"><div class="ct"><b>${C.n}</b><span class="doto">${eur(v)}</span></div>
      <div class="bar" style="height:6px"><i data-w="${Math.round(v/maxCat*100)}%" style="background:${C.c}"></i></div></div></div>`}).join('')||'<div class="empty">Sem despesas</div>'}
  </div>
  <div class="card"><h3>Orçamentos</h3>
    ${Object.entries(st.budgets).map(([c,b])=>{const C=FIN_CATS[c];const v=byCat[c]||0;const p=Math.min(100,Math.round(v/b*100));
      return `<div class="brow"><div class="bt"><b>${C.ic} ${C.n}</b><span class="doto" style="color:${p>=100?'var(--red)':p>75?'var(--orange)':'var(--txt2)'}">${eur(v)} / ${eur(b)}</span></div>
      <div class="bar"><i data-w="${p}%" style="background:${p>=100?'var(--red)':p>75?'var(--orange)':'var(--green)'}"></i></div></div>`}).join('')}
  </div>
  <div class="card"><h3>Transações <span class="act">${shown.length}</span></h3>
    <div class="fchips">
      <button class="${_finFilter==='all'?'on':''}" onclick="setFinFilter('all')">Todas</button>
      ${Object.entries(FIN_CATS).map(([c,C])=>`<button class="${_finFilter===c?'on':''}" onclick="setFinFilter('${c}')">${C.ic} ${C.n}</button>`).join('')}
    </div>
    ${shown.sort((a,b)=>b.d-a.d).map((t,i)=>{const C=FIN_CATS[t.cat];
      return `<div class="tx" style="animation-delay:${i*40}ms"><div class="ci ic" style="width:34px;height:34px;border-radius:9px;background:color-mix(in srgb,${C.c} 14%,transparent);color:${C.c};display:grid;place-items:center">${C.ic}</div>
      <div class="bd" style="flex:1;min-width:0"><b style="display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.n)}</b><span class="xs muted">dia ${t.d} · ${C.n}</span></div>
      <span class="amt" style="color:${t.v>0?'var(--green)':'var(--txt)'}">${t.v>0?'+':''}${eur(t.v)}</span>
      <button class="icobtn" style="width:26px;height:26px;font-size:10px;margin-left:4px" onclick="delTx(${all.indexOf(t)})">✕</button></div>`}).join('')||'<div class="empty">Sem movimentos</div>'}
    <button class="btn full" style="margin-top:14px" onclick="openTxSheet()">＋ &nbsp;Novo movimento</button>

let _txType='exp',_txCat='ali';
function openTxSheet(){
  haptic();_txType='exp';_txCat='ali';
  sheetOpen(`<h2>💰 Novo movimento <span class="tiny muted" style="font-weight:400">· ${monthLabel(_finMonth)}</span></h2>
  <div style="display:flex;gap:8px;margin-bottom:16px">
    <button id="txBexp" class="btn" style="flex:1;background:var(--red);color:#fff" onclick="setTxType('exp')">− Despesa</button>
    <button id="txBinc" class="btn ghost" style="flex:1" onclick="setTxType('inc')">＋ Receita</button>
  </div>
  <div class="frow"><label>Valor</label>
    <input id="txV" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00 €"
      class="doto" style="font-size:26px;font-weight:900;text-align:center;padding:14px"></div>
  <div class="frow"><label>Descrição</label>
    <input id="txN" placeholder="Ex.: Continente, gesso tipo IV, coroa e-max…"></div>
  <div class="frow"><label>Categoria</label>
    <div id="txCats" style="display:flex;flex-wrap:wrap;gap:6px">${txCatChips()}</div></div>

  setTimeout(()=>{const v=document.getElementById('txV');if(v)v.focus()},420);
}
function txCatChips(){
  return Object.entries(FIN_CATS).map(([c,C])=>{
    const on=c===_txCat;
    return `<button onclick="setTxCat('${c}')" style="padding:8px 13px;border-radius:99px;font-size:12px;font-weight:600;
      border:1px solid ${on?'transparent':'var(--border2)'};
      background:${on?`color-mix(in srgb,${C.c} 20%,transparent)`:'var(--surface2)'};
      color:${on?C.c:'var(--txt2)'}">${C.ic} ${C.n}</button>`;
  }).join('');
}
function delTx(idx){
  if(idx<0)return;
  const all=LS(K.fin,[]);all.splice(idx,1);save(K.fin,all);
  window._finAnimated=false;renderFin();toast('Movimento apagado');
}
function setTxCat(c){haptic();_txCat=c;document.getElementById('txCats').innerHTML=txCatChips()}
function setTxType(t){
  haptic();_txType=t;
  const e=document.getElementById('txBexp'),i=document.getElementById('txBinc');
  if(t==='exp'){e.className='btn';e.style.cssText='flex:1;background:var(--red);color:#fff';i.className='btn ghost';i.style.cssText='flex:1'}
  else{i.className='btn';i.style.cssText='flex:1;background:var(--green);color:#fff';e.className='btn ghost';e.style.cssText='flex:1'}
}
function saveTx(){
  const n=document.getElementById('txN').value.trim();
  const raw=parseFloat(document.getElementById('txV').value);
  if(!raw||raw<=0)return toast('Indica o valor');
  if(!n)return toast('Falta a descrição');
  const v=_txType==='exp'?-Math.abs(raw):Math.abs(raw);
  const all=LS(K.fin,[]);
  const day=_finMonth===monthKey(now())?+todayISO().slice(8):1;
  all.push({m:_finMonth,d:day,n,cat:_txCat,v});save(K.fin,all);
  closeAll();window._finAnimated=false;renderFin();
  toast(`${_txType==='exp'?'Despesa':'Receita'} de ${eur(Math.abs(v))} guardada ✓`);
}
function drawFinChart(all){
  if(!window.Chart)return;const ctx=document.getElementById('finChart');if(!ctx)return;
  if(_charts.f)_charts.f.destroy();const t=chartTheme();
  const months=[...Array(6)].map((_,i)=>{const[y,m]=_finMonth.split('-').map(Number);return monthKey(new Date(y,m-1-(5-i),15))});
  const inc=months.map(mk=>all.filter(x=>x.m===mk&&x.v>0).reduce((a,x)=>a+x.v,0));
  const exp=months.map(mk=>-all.filter(x=>x.m===mk&&x.v<0).reduce((a,x)=>a+x.v,0));
  _charts.f=new Chart(ctx,{type:'bar',
    data:{labels:months.map(mk=>monthLabel(mk).slice(0,3)),datasets:[
      {label:'Receitas',data:inc,backgroundColor:t.green,borderRadius:4,barPercentage:.55,categoryPercentage:.7},
      {label:'Despesas',data:exp,backgroundColor:t.red,borderRadius:4,barPercentage:.55,categoryPercentage:.7}
    ]},
    options:{...baseOpts(t),plugins:{...baseOpts(t).plugins,legend:{display:true,position:'top',align:'end',
      labels:{color:t.txt2,boxWidth:8,boxHeight:8,usePointStyle:true,pointStyle:'circle',font:{family:'Inter',size:11}}}}}});
}

  <h2>💰 Orçamentos mensais</h2>
  <div class="fgrid">
    ${Object.entries(st.budgets).map(([c,v])=>`<div class="frow"><label>${FIN_CATS[c].ic} ${FIN_CATS[c].n}</label><input data-budget="${c}" type="number" value="${v}"></div>`).join('')}
  </div>
  <div class="divider"></div>
  <h2>✦ Assistente IA</h2>
  <div class="frow"><label>Chave API Anthropic</label>
    <input id="sKey" type="password" placeholder="sk-ant-…" value="${esc(key)}">
    <div class="hint">Guardada apenas neste dispositivo (localStorage). Nunca é enviada para lado nenhum exceto para a API da Anthropic.</div></div>
  <div class="divider"></div>
  <h2>💾 Backup</h2>
  <div style="display:flex;gap:10px">
    <button class="btn ghost" style="flex:1" onclick="exportBackup()">⤓ Exportar</button>
    <button class="btn ghost" style="flex:1" onclick="document.getElementById('impFile').click()">⤒ Importar</button>
    <input type="file" id="impFile" accept="application/json" style="display:none" onchange="importBackup(this)">
  </div>
  <div class="divider"></div>
  <h2>🧹 Começar do zero</h2>
  <div class="frow"><div class="hint" style="margin-top:0">Apaga todos os dados de exemplo (tarefas, laboratório, finanças, hábitos…) e deixa a app vazia, pronta para os teus próprios dados. Exporta um backup primeiro se quiseres guardar algo.</div></div>
  <button class="btn full ghost" style="color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--border2))" onclick="resetAll()">Apagar tudo e começar do zero</button>
  <div class="divider"></div>
  <button class="btn full" onclick="saveSettings()">Guardar definições</button>`);
}
function saveSettings(){
  const cur=LS(K.set,{});
  const budgets={};document.querySelectorAll('[data-budget]').forEach(i=>budgets[i.dataset.budget]=+i.value||0);
  save(K.set,{...cur,
    name:document.getElementById('sName').value.trim()||DEFAULT_SETTINGS.name,
    waterGoal:+document.getElementById('sWa').value||DEFAULT_SETTINGS.waterGoal,
    budgets});
  const k=document.getElementById('sKey').value.trim();
  if(k)localStorage.setItem(K.key,k);else localStorage.removeItem(K.key);
  closeAll();window._ringsAnimated=false;window._homeAnimated=false;window._finAnimated=false;
  const on=document.querySelector('nav button.on');go(on.dataset.sec,on);
  toast('Definições guardadas ✓');
}

/* ═══════════════ BACKUP ═══════════════ */
function exportBackup(){
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('fl_'))data[k]=localStorage.getItem(k)}
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`lifeos-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href);
  toast('Backup exportado ⤓');
}
function resetAll(){
  if(!confirm('Apagar TODOS os dados e começar do zero?\n\nEsta ação é irreversível. Se quiseres guardar, exporta um backup primeiro.'))return;
  const keys=[];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('fl_'))keys.push(k)}
  keys.forEach(k=>localStorage.removeItem(k));
  // marca as chaves principais como vazias para o seedOnce não repor os dados de exemplo
  save(K.tasks,[]);save(K.lab,[]);save(K.proj,[]);save(K.fin,[]);save(K.weight,[]);
  save(K.workouts,[]);save(K.meals,[]);save(K.habits,{});save(K.social,[]);save(K.labnotes,[]);
  toast('Dados apagados — a recarregar…');setTimeout(()=>location.reload(),700);
}
function importBackup(input){
  const f=input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const data=JSON.parse(rd.result);
    Object.entries(data).forEach(([k,v])=>{if(k.startsWith('fl_'))localStorage.setItem(k,v)});
    toast('Backup restaurado — a recarregar…');setTimeout(()=>location.reload(),900);
  }catch(e){toast('Ficheiro inválido')}};
  rd.readAsText(f);
}

/* ═══════════════ IA — Anthropic (on-device key) ═══════════════ */
async function askClaude(prompt){
  const key=localStorage.getItem(K.key);
  if(!key)throw new Error('NOKEY');
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-opus-4-8',max_tokens:600,
      system:'És o assistente do Life OS de Filipe Lemos, prostético dentário de 35 anos no Faial, Açores. Responde SEMPRE em português de Portugal, de forma curta, prática e motivadora (máx. 5 frases).',
      messages:[{role:'user',content:prompt}]})});
  if(!res.ok)throw new Error('API '+res.status);
  const j=await res.json();
  if(j.stop_reason==='refusal')return 'O pedido foi recusado pelos filtros de segurança.';
  return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')||'(sem resposta)';
}
async function aiInsight(){
  haptic();
  if(!localStorage.getItem(K.key)){
    sheetOpen(`<h2>✦ Assistente IA</h2><p class="muted tiny" style="margin-bottom:14px">Para usar o insight diário, adiciona a tua chave API Anthropic nas definições. Fica só no teu dispositivo.</p><button class="btn full" onclick="openSettings()">Abrir definições</button>`);
    return;
  }
  const r=ringProg();const tasks=LS(K.tasks,[]).filter(t=>!t.done).map(t=>t.t);
  const lab=LS(K.lab,[]).filter(j=>j.fase!=='Entregue').map(j=>`${j.tipo} (${j.fase}, ${j.prazo})`);
  sheetOpen(`<h2>✦ Insight do dia</h2><div class="ai-out" id="aiOut"><span class="thinking"><i></i><i></i><i></i></span></div>`);
  try{
    const txt=await askClaude(`Hoje é ${fmtLong(todayISO())}. Peso atual ${r.cur} kg (meta ${r.st.goalWeight}). Água ${r.water.toFixed(1)}/${r.st.waterGoal} L. Jejum ${r.fastH.toFixed(1)} h. Tarefas abertas: ${tasks.join('; ')||'nenhuma'}. Trabalhos de lab: ${lab.join('; ')||'nenhum'}. Dá-me um insight/plano curto para o resto do dia.`);
    const out=document.getElementById('aiOut');if(out)out.textContent=txt;
  }catch(e){
    const out=document.getElementById('aiOut');
    if(out)out.textContent=e.message==='NOKEY'?'Falta a chave API nas definições.':'Erro ao contactar a API ('+e.message+'). Verifica a ligação e a chave.';
  }
}

/* ═══════════════ METEO — Horta (open-meteo, com fallback offline) ═══════════════ */
async function loadWeather(){
  const ICONS={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',61:'🌧',63:'🌧',65:'🌧',80:'🌦',95:'⛈'};
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=38.53&longitude=-28.63&current=temperature_2m,weather_code&timezone=Atlantic%2FAzores');
    const j=await r.json();
    const t=Math.round(j.current.temperature_2m);
    save('fl_wx_cache',{t,c:j.current.weather_code});
    document.getElementById('wxT').textContent=t+'°';
    document.getElementById('wxIc').textContent=ICONS[j.current.weather_code]||'⛅';
  }catch(e){
    const c=LS('fl_wx_cache',null);
    if(c){document.getElementById('wxT').textContent=c.t+'°';document.getElementById('wxIc').textContent=ICONS[c.c]||'⛅'}
    else document.getElementById('wxT').textContent='—';
  }
}

/* ═══════════════ TEMA ═══════════════ */
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  localStorage.setItem(K.theme,t);
  document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0a0a0a':'#f4f4f2';
  Object.values(_charts).forEach(c=>c&&c.destroy());_charts={};
  const on=document.querySelector('nav button.on');
  window._ringsAnimated=true;
  go(on.dataset.sec,on);
}
function toggleTheme(){haptic();applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}

/* ═══════════════ NATIVO — Capacitor ═══════════════ */
async function initNative(){
  const C=window.Capacitor;
  if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
  try{
    const {StatusBar}=C.Plugins;
    if(StatusBar){await StatusBar.setBackgroundColor({color:'#0a0a0a'});await StatusBar.setStyle({style:'DARK'})}
  }catch(e){}
  try{
    const {App}=C.Plugins;
    if(App)App.addListener('backButton',({canGoBack})=>{
      const anyOpen=document.querySelector('.sheet.on,.side.on');
      if(anyOpen){closeAll();return}
      const on=document.querySelector('nav button.on');
      if(on&&on.dataset.sec!=='home'){go('home',document.querySelector('[data-sec="home"]'))}
      else App.exitApp();
    });
  }catch(e){}
}

/* ═══════════════ RELÓGIO ═══════════════ */
function tickClock(){
  const hm=nowHM();
  document.getElementById('clock').textContent=hm;
  const h=+hm.split(':')[0];
  document.getElementById('greet').firstChild.textContent=(h<6?'Boa noite, ':h<13?'Bom dia, ':h<20?'Boa tarde, ':'Boa noite, ')+S().name;
  const hc=document.getElementById('hmClock');if(hc)hc.textContent=hm;
}

/* ═══════════════ ARRANQUE ═══════════════ */
seedOnce();
applyThemeInit();
function applyThemeInit(){
  const t=localStorage.getItem(K.theme)||'dark';
  document.documentElement.dataset.theme=t;
  document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0a0a0a':'#f4f4f2';
}
document.getElementById('dateStr').textContent=fmtLong(todayISO());
document.getElementById('themeBtn').onclick=toggleTheme;
document.getElementById('setBtn').onclick=()=>{haptic();openSettings()};
document.getElementById('alertsBtn').onclick=()=>{haptic();sideOpen()};
tickClock();setInterval(tickClock,15000);
renderSide();
renderHome();
loadWeather();
initNative();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
