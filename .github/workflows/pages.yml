name: Deploy PWA to GitHub Pages

# Disparo manual por agora: o deploy requer o GitHub Pages ativado em
# Settings → Pages → Source: GitHub Actions (decisão pendente do dono).
# Assim que estiver ativo, voltar a ligar o gatilho de push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
